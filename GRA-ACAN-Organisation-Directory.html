function isUrl(u){return typeof u==="string"&&/^https?:\/\/\S+$/.test(u);}
function host(u){try{var x=new URL(u);return x.hostname.replace(/^www\./,"")+(x.pathname.length>1?x.pathname:"");}catch(e){return u;}}
function link(u,label){return '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label||host(u))+'</a>';}
function num(v){return typeof v==="number";}
function fmt(v){if(v==null)return "";if(num(v))return (Math.round(v*100)/100).toString();return String(v);}
function sheet(name){for(var i=0;i<SH.length;i++)if(SH[i].name===name)return SH[i];return null;}
function slug(i){return "#/t/"+i;}
function objRows(s){return s.rows.map(function(r){var o={};s.headers.forEach(function(h,i){o[h]=r[i];});return o;});}

/* ---------- tooltip ---------- */
var tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.style.display="block";moveTip(e);}
function moveTip(e){var x=e.clientX+14,y=e.clientY+14;var w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.display="none";}
document.addEventListener("mouseover",function(e){var t=e.target.closest("[data-tip]");if(t)showTip(e,t.getAttribute("data-tip"));});
document.addEventListener("mousemove",function(e){if(tip.style.display==="block"){if(e.target.closest("[data-tip]"))moveTip(e);else hideTip();}});
document.addEventListener("focusin",function(e){var t=e.target.closest("[data-tip]");if(t){var r=t.getBoundingClientRect();showTip({clientX:r.right,clientY:r.top},t.getAttribute("data-tip"));}});
document.addEventListener("focusout",hideTip);

/* ---------- cell rendering ---------- */
function isScoreHeader(h){return /Score \(1-5\)$/.test(h)||DOMAINS.indexOf(h)>=0;}
function scoreChip(v){if(!num(v))return esc(v==null?"":v);var k=Math.max(1,Math.min(5,Math.round(v)));return '<span class="sc sc'+k+'">'+v+'</span>';}
function statusPill(v){var c=v==="Verified"?"s-ok":v==="Needs Review"?"s-rev":v==="Unavailable"?"s-una":"s-np";return '<span class="pill '+c+'">'+esc(v)+'</span>';}
function availCls(v){return v==="Published"?"a-pub":v==="Published (excerpt only)"?"a-ex":v==="Unable to verify"?"a-uv":"a-np";}
function renderCell(h,v){
  if(v==null||v==="")return "";
  if(isScoreHeader(h))return scoreChip(v);
  if(h==="Website Verification Status")return statusPill(v);
  if(/Availability$/.test(h))return '<span class="'+availCls(v)+'">'+esc(v)+'</span>';
  if(h==="Result")return '<span class="pill '+(v==="Pass"?"s-ok":"s-una")+'">'+esc(v)+'</span>';
  if(isUrl(v))return link(v);
  if(typeof v==="string"&&v.length>70)return '<div class="cl">'+linkify(esc(v))+'</div>';
  return linkify(esc(v));
}
function linkify(s){return s.replace(/(https?:\/\/[^\s;,)]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>';});}
function widthCls(h,s){var lens=s.rows.slice(0,40).map(function(r){var v=r[s.headers.indexOf(h)];return v==null?0:String(v).length;});var mx=Math.max.apply(null,lens.concat([0]));if(mx>120)return "w-l";if(mx>40)return "w-m";return "";}

/* ---------- CSV ---------- */
function csv(headers,rows,name){
  var lines=[headers].concat(rows);
  var txt="﻿"+lines.map(function(l){return l.map(function(v){v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\r\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function fileSlug(s){return s.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* ---------- data table ---------- */
function DataTable(el,s,opt){
  opt=opt||{};
  var self=this, H=s.headers, rows=s.rows.map(function(r,i){return {i:i,r:r};});
  var vis=H.map(function(h){return opt.hidden?opt.hidden.indexOf(h)<0:true;});
  var sortCol=-1,sortDir=0, q="", filt={}, minDom="", minVal="";
  var filterCols=opt.filters||H.filter(function(h,ci){var vals={};var n=0;s.rows.forEach(function(r){var v=r[ci];if(v!=null&&v!==""&&!vals[v]){vals[v]=1;n++;}});return n>1&&n<=14&&!isScoreHeader(h)&&!s.rows.every(function(r){return r[ci]==null||num(r[ci]);});}).slice(0,8);
  var scoreCols=H.filter(isScoreHeader);
  var stickyN=opt.sticky||0;
  var html='<div class="dt-tools"><div><label for="'+opt.id+'-q">Search this tab</label><input type="search" id="'+opt.id+'-q" placeholder="Any word in the rows"></div>';
  filterCols.forEach(function(h,k){var ci=H.indexOf(h);var vals=[];s.rows.forEach(function(r){var v=r[ci];if(v!=null&&v!==""&&vals.indexOf(v)<0)vals.push(v);});vals.sort();
    html+='<div><label for="'+opt.id+'-f'+k+'">'+esc(h)+'</label><select id="'+opt.id+'-f'+k+'" data-h="'+esc(h)+'"><option value="">All</option>'+vals.map(function(v){return '<option>'+esc(v)+'</option>';}).join("")+'</select></div>';});
  if(scoreCols.length){html+='<div><label for="'+opt.id+'-md">Score filter</label><select id="'+opt.id+'-md"><option value="">Any domain</option>'+scoreCols.map(function(h){return '<option>'+esc(h)+'</option>';}).join("")+'</select></div><div><label for="'+opt.id+'-mv">At least</label><select id="'+opt.id+'-mv"><option value="">Any score</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>';}
  html+='</div><div class="dt-bar"><span class="dt-count" aria-live="polite"></span><span class="acts">';
  html+='<span class="colmenu"><button class="btn" type="button" aria-expanded="false">Columns</button><div class="pop"><div class="pre">'+(opt.presets?Object.keys(opt.presets).map(function(p){return '<button class="btn" type="button" data-pre="'+esc(p)+'">'+esc(p)+'</button>';}).join(""):"")+'<button class="btn" type="button" data-pre="__all">All columns</button></div>'+H.map(function(h,ci){return '<label><input type="checkbox" data-ci="'+ci+'" '+(vis[ci]?"checked":"")+'> '+esc(h)+'</label>';}).join("")+'</div></span> ';
  html+='<button class="btn" type="button" data-act="reset">Clear filters</button> <button class="btn" type="button" data-act="csv">Export CSV</button> <button class="btn" type="button" data-act="print">Print</button></span></div>';
  html+='<div class="dt-wrap"><table class="dt"><thead></thead><tbody></tbody></table></div>';
  el.innerHTML=html;
  var thead=$("thead",el),tbody=$("tbody",el),count=$(".dt-count",el),menu=$(".colmenu",el);
  var wcls=H.map(function(h){return widthCls(h,s);});
  function filtered(){
    var out=rows.filter(function(o){
      for(var h in filt){if(filt[h]&&String(o.r[H.indexOf(h)])!==filt[h])return false;}
      if(minDom&&minVal){var v=o.r[H.indexOf(minDom)];if(!num(v)||v<+minVal)return false;}
      if(q){var t=o.r.join(" \u0001 ").toLowerCase();if(t.indexOf(q)<0)return false;}
      return true;});
    if(sortCol>=0&&sortDir){out.sort(function(a,b){var x=a.r[sortCol],y=b.r[sortCol];if(x==null||x==="")return 1;if(y==null||y==="")return -1;var c=(num(x)&&num(y))?x-y:String(x).localeCompare(String(y),"en",{numeric:true,sensitivity:"base"});return c*sortDir||a.i-b.i;});}
    return out;
  }
  function draw(){
    var out=filtered();
    var cols=H.map(function(h,ci){return ci;}).filter(function(ci){return vis[ci];});
    var left=0, lefts={}, wid={};
    cols.forEach(function(ci,k){if(k<stickyN){lefts[ci]=left;wid[ci]=(opt.stickyW&&opt.stickyW[k])||110;left+=wid[ci];}});
    function stk(ci){return (ci in lefts)?' style="left:'+lefts[ci]+'px;min-width:'+wid[ci]+'px;max-width:'+wid[ci]+'px"':'';}
    thead.innerHTML='<tr>'+cols.map(function(ci){var ar=ci===sortCol&&sortDir?(sortDir>0?"\u25B2":"\u25BC"):"";
      return '<th'+((ci in lefts)?' class="sticky"':'')+stk(ci)+' data-ci="'+ci+'" scope="col" tabindex="0" aria-sort="'+(ci===sortCol&&sortDir?(sortDir>0?"ascending":"descending"):"none")+'">'+esc(H[ci])+'<span class="ar">'+ar+'</span></th>';}).join("")+'</tr>';
    tbody.innerHTML=out.map(function(o){return '<tr'+(opt.onRow?' class="click" tabindex="0"':'')+' data-i="'+o.i+'">'+cols.map(function(ci){var v=o.r[ci];var c=[];if(num(v)&&!isScoreHeader(H[ci]))c.push("n");if(wcls[ci]&&!(ci in lefts))c.push(wcls[ci]);if(ci in lefts)c.push("sticky");
      return '<td'+(c.length?' class="'+c.join(" ")+'"':'')+stk(ci)+'>'+renderCell(H[ci],v)+'</td>';}).join("")+'</tr>';}).join("")||'<tr><td colspan="'+cols.length+'" class="muted">No rows match. Clear the filters or try a shorter search.</td></tr>';
    count.textContent=out.length+" of "+rows.length+" rows shown";
    self.current=out;
  }
  $("#"+opt.id+"-q",el).addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();draw();});
  $$("select[data-h]",el).forEach(function(sel){sel.addEventListener("change",function(){filt[sel.getAttribute("data-h")]=sel.value;draw();});});
  if(scoreCols.length){$("#"+opt.id+"-md",el).addEventListener("change",function(e){minDom=e.target.value;draw();});$("#"+opt.id+"-mv",el).addEventListener("change",function(e){minVal=e.target.value;draw();});}
  thead.addEventListener("click",function(e){var th=e.target.closest("th");if(!th)return;var ci=+th.getAttribute("data-ci");if(ci===sortCol){sortDir=sortDir===1?-1:sortDir===-1?0:1;}else{sortCol=ci;sortDir=1;}draw();});
  thead.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();var th=e.target.closest("th");if(th)th.click();}});
  tbody.addEventListener("click",function(e){if(e.target.closest("a"))return;var td=e.target.closest("td");if(opt.onRow){var tr=e.target.closest("tr[data-i]");if(tr)opt.onRow(rows[+tr.getAttribute("data-i")].r);return;}if(td&&$(".cl",td))td.classList.toggle("open");});
  tbody.addEventListener("keydown",function(e){if(e.key==="Enter"&&opt.onRow){var tr=e.target.closest("tr[data-i]");if(tr)opt.onRow(rows[+tr.getAttribute("data-i")].r);}});
  $(".colmenu>.btn",el).addEventListener("click",function(){menu.classList.toggle("open");this.setAttribute("aria-expanded",menu.classList.contains("open"));});
  document.addEventListener("click",function(e){if(!e.target.closest(".colmenu"))menu.classList.remove("open");});
  $$(".pop input[data-ci]",el).forEach(function(cb){cb.addEventListener("change",function(){vis[+cb.getAttribute("data-ci")]=cb.checked;draw();});});
  $$(".pop [data-pre]",el).forEach(function(b){b.addEventListener("click",function(){var p=b.getAttribute("data-pre");vis=H.map(function(h){return p==="__all"?true:opt.presets[p].indexOf(h)>=0;});$$(".pop input[data-ci]",el).forEach(function(cb){cb.checked=vis[+cb.getAttribute("data-ci")];});draw();});});
  $("[data-act=reset]",el).addEventListener("click",function(){q="";filt={};minDom="";minVal="";sortCol=-1;sortDir=0;$$("select,input[type=search]",el).forEach(function(x){x.value="";});draw();});
  $("[data-act=csv]",el).addEventListener("click",function(){var cols=H.map(function(h,ci){return ci;}).filter(function(ci){return vis[ci];});csv(cols.map(function(ci){return H[ci];}),self.current.map(function(o){return cols.map(function(ci){return o.r[ci];});}),fileSlug(opt.file||s.name)+".csv");});
  $("[data-act=print]",el).addEventListener("click",function(){document.body.classList.remove("pp");window.print();});
  draw();
}

/* ---------- charts (plain SVG) ---------- */
var NS="http://www.w3.org/2000/svg";
function svgOpen(w,h,label){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label)+'">';}
function rbar(x,y,w,h){ // horizontal bar, rounded data end only
  if(w<=0)return "";var r=Math.min(4,h/2,w);return 'M'+x+','+y+'h'+(w-r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(h-2*r)+'a'+r+','+r+' 0 0 1 -'+r+','+r+'h-'+(w-r)+'z';}
function vbar(x,y,w,h){ // vertical bar from baseline y+h up, rounded top
  if(h<=0)return "";var r=Math.min(4,w/2,h);return 'M'+x+','+(y+h)+'v-'+(h-r)+'a'+r+','+r+' 0 0 1 '+r+',-'+r+'h'+(w-2*r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'v'+(h-r)+'z';}
function rankedBars(items,opt){ // items:[{label,value,color,tip}]
  var lw=opt.labelW||260,bh=opt.barH||16,gap=6,W=opt.width||1000,max=opt.max,top=22;
  var H=top+items.length*(bh+gap)+8, pw=W-lw-50;
  var s=svgOpen(W,H,opt.title);
  for(var t=0;t<=max;t+=opt.step){var x=lw+pw*t/max;s+='<line class="gl" x1="'+x+'" x2="'+x+'" y1="'+(top-4)+'" y2="'+(H-6)+'"/><text class="ax" x="'+x+'" y="'+(top-8)+'" text-anchor="middle">'+t+'</text>';}
  items.forEach(function(it,i){var y=top+i*(bh+gap),w=pw*it.value/max;
    s+='<text class="lb" x="'+(lw-8)+'" y="'+(y+bh/2+4)+'" text-anchor="end">'+esc(it.label.length>40?it.label.slice(0,38)+"…":it.label)+'</text>';
    s+='<path d="'+rbar(lw,y,w,bh)+'" fill="'+it.color+'"/><rect x="'+lw+'" y="'+(y-gap/2)+'" width="'+(pw+40)+'" height="'+(bh+gap)+'" fill="transparent" tabindex="0" data-tip="'+esc(it.tip)+'"/>';
    s+='<text class="val" x="'+(lw+w+6)+'" y="'+(y+bh/2+4)+'">'+fmt(it.value)+'</text>';});
  s+='<line class="base" x1="'+lw+'" x2="'+lw+'" y1="'+(top-4)+'" y2="'+(H-6)+'"/></svg>';
  return '<div class="chart">'+s+'</div>';
}
function stackedBars(items,opt){ // items:[{label,values[5],tip}]
  var lw=opt.labelW||260,bh=16,gap=6,W=1000,max=25,top=22,H=top+items.length*(bh+gap)+8,pw=W-lw-50;
  var s=svgOpen(W,H,opt.title);
  for(var t=0;t<=max;t+=5){var x=lw+pw*t/max;s+='<line class="gl" x1="'+x+'" x2="'+x+'" y1="'+(top-4)+'" y2="'+(H-6)+'"/><text class="ax" x="'+x+'" y="'+(top-8)+'" text-anchor="middle">'+t+'</text>';}
  items.forEach(function(it,i){var y=top+i*(bh+gap),x=lw,tot=0;
    s+='<text class="lb" x="'+(lw-8)+'" y="'+(y+bh/2+4)+'" text-anchor="end">'+esc(it.label.length>40?it.label.slice(0,38)+"…":it.label)+'</text>';
    it.values.forEach(function(v,k){if(!num(v))return;var w=pw*v/max;var last=k===4;
      s+=(last?'<path d="'+rbar(x,y,Math.max(w-2,0),bh)+'"':'<rect x="'+x+'" y="'+y+'" width="'+Math.max(w-2,0)+'" height="'+bh+'"')+' fill="'+DCOL[DOMAINS[k]]+'" tabindex="0" data-tip="<b>'+esc(it.label)+'</b><br>'+DOMAINS[k]+': '+v+'"/>';x+=w;tot+=v;});
    s+='<text class="val" x="'+(x+4)+'" y="'+(y+bh/2+4)+'">'+tot+'</text>';});
  s+='</svg>';
  return '<div class="chart">'+s+'</div>';
}
function domainColumns(vals,opt){ // five vertical bars, one per domain
  var W=opt.width||250,H=opt.height||150,top=14,bot=26,lw=22,pw=W-lw-6,ph=H-top-bot,max=5,bw=pw/5*0.62;
  var s=svgOpen(W,H,opt.title);
  for(var t=0;t<=max;t++){var y=top+ph-ph*t/max;s+='<line class="gl" x1="'+lw+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'"/>'+(t%1===0?'<text class="ax" x="'+(lw-5)+'" y="'+(y+4)+'" text-anchor="end">'+t+'</text>':'');}
  vals.forEach(function(v,k){var cx=lw+pw*(k+0.5)/5,h=num(v)?ph*v/max:0;
    s+='<path d="'+vbar(cx-bw/2,top+ph-h,bw,h)+'" fill="'+DCOL[DOMAINS[k]]+'"/><rect x="'+(cx-pw/10)+'" y="'+top+'" width="'+(pw/5)+'" height="'+ph+'" fill="transparent" tabindex="0" data-tip="<b>'+esc(opt.name)+'</b><br>'+DOMAINS[k]+': '+fmt(v)+'"/>';
    s+='<text class="val" x="'+cx+'" y="'+(top+ph-h-4)+'" text-anchor="middle">'+fmt(v)+'</text><text class="ax" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+DOMAINS[k].slice(0,4)+'</text>';});
  s+='<line class="base" x1="'+lw+'" x2="'+(W-4)+'" y1="'+(top+ph)+'" y2="'+(top+ph)+'"/></svg>';
  return '<div class="chart">'+s+'</div>';
}
function groupedBars(rows,opt){ // rows:[{label, a, b}] series GRA/ACAN
  var W=1000,H=300,top=20,bot=34,lw=40,pw=W-lw-10,ph=H-top-bot,max=5,gw=pw/rows.length,bw=Math.min(46,gw*0.3);
  var s=svgOpen(W,H,opt.title);
  for(var t=0;t<=max;t++){var y=top+ph-ph*t/max;s+='<line class="gl" x1="'+lw+'" x2="'+(W-6)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(lw-6)+'" y="'+(y+4)+'" text-anchor="end">'+t+'</text>';}
  rows.forEach(function(r,i){var cx=lw+gw*(i+0.5);
    [["GRA",r.a,-1],["ACAN",r.b,1]].forEach(function(sr){var h=ph*sr[1]/max,x=sr[2]<0?cx-bw-1:cx+1;
      s+='<path d="'+vbar(x,top+ph-h,bw,h)+'" fill="'+LCOL[sr[0]]+'" tabindex="0" data-tip="<b>'+esc(r.label)+'</b><br>'+sr[0]+' average: '+fmt(sr[1])+'"/><text class="val" x="'+(x+bw/2)+'" y="'+(top+ph-h-4)+'" text-anchor="middle">'+fmt(sr[1])+'</text>';});
    s+='<text class="lb" x="'+cx+'" y="'+(H-12)+'" text-anchor="middle">'+esc(r.label)+'</text>';});
  s+='<line class="base" x1="'+lw+'" x2="'+(W-6)+'" y1="'+(top+ph)+'" y2="'+(top+ph)+'"/></svg>';
  return '<div class="legend"><span><i style="background:var(--gra)"></i>GRA</span><span><i style="background:var(--acan)"></i>ACAN</span></div><div class="chart">'+s+'</div>';
}
function scatter(pts,opt){ // pts:[{x,y,list,label}] x=breadth 5-25, y=domains active 0-5
  var W=1000,H=380,l=50,r=20,t=16,b=44,pw=W-l-r,ph=H-t-b,x0=4,x1=26,y0=-0.5,y1=5.5;
  function X(v){return l+pw*(v-x0)/(x1-x0);} function Y(v){return t+ph-ph*(v-y0)/(y1-y0);}
  var s=svgOpen(W,H,opt.title);
  for(var xv=5;xv<=25;xv+=5){s+='<line class="gl" x1="'+X(xv)+'" x2="'+X(xv)+'" y1="'+t+'" y2="'+(t+ph)+'"/><text class="ax" x="'+X(xv)+'" y="'+(t+ph+16)+'" text-anchor="middle">'+xv+'</text>';}
  for(var yv=0;yv<=5;yv++){s+='<line class="gl" x1="'+l+'" x2="'+(l+pw)+'" y1="'+Y(yv)+'" y2="'+Y(yv)+'"/><text class="ax" x="'+(l-8)+'" y="'+(Y(yv)+4)+'" text-anchor="end">'+yv+'</text>';}
  s+='<text class="ax" x="'+(l+pw/2)+'" y="'+(H-6)+'" text-anchor="middle">Breadth Score (sum of the five domain scores)</text>';
  s+='<text class="ax" transform="translate(14,'+(t+ph/2)+') rotate(-90)" text-anchor="middle">Domains Active (scores of 4 or 5)</text>';
  var groups={};pts.forEach(function(p){var k=p.x+"|"+p.y;(groups[k]=groups[k]||[]).push(p);});
  Object.keys(groups).forEach(function(k){var g=groups[k];g.forEach(function(p,i){var n=g.length;var off=n>1?(i-(n-1)/2)*Math.min(9,90/n):0;var cx=X(p.x)+off*0.55,cy=Y(p.y)+((i%2)?3:-3)*(n>1?1:0);
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="5" fill="'+LCOL[p.list]+'" stroke="var(--paper)" stroke-width="2" tabindex="0" data-tip="<b>'+esc(p.label)+'</b> ('+p.list+')<br>Breadth '+p.x+', Domains Active '+p.y+'"/>';});});
  s+='</svg>';
  return '<div class="legend"><span><i class="dot" style="background:var(--gra)"></i>GRA</span><span><i class="dot" style="background:var(--acan)"></i>ACAN</span></div><div class="chart">'+s+'</div>';
}
function heatmap(rows,opt){ // rows:[{label,scores[5],sub}]
  var h='<div class="heat"><table class="hm"><thead><tr><th>'+esc(opt.first||"Organisation")+'</th>'+DOMAINS.map(function(d){return '<th class="c">'+d+'</th>';}).join("")+(opt.extra?'<th class="c">'+esc(opt.extra)+'</th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td class="o" title="'+esc(r.label)+'">'+(r.id?'<button class="linkbtn" data-org="'+esc(r.id)+'">'+esc(r.label)+'</button>':esc(r.label))+'</td>'+r.scores.map(function(v,k){
    if(!num(v))return '<td class="h e">n/s</td>';var c=Math.max(1,Math.min(5,v));return '<td class="h" style="background:var(--h'+c+');color:var(--h'+c+'t)" tabindex="0" data-tip="<b>'+esc(r.label)+'</b><br>'+DOMAINS[k]+': '+v+' ('+esc(RUB[v]||"")+')">'+v+'</td>';}).join("")+(opt.extra?'<td class="h e">'+fmt(r.extra)+'</td>':'')+'</tr>';});
  return h+'</tbody></table></div>';
}
var RUB={1:"Nothing meaningful found",2:"Small or occasional activity",3:"Real, regular activity, modest scale",4:"Major, documented work",5:"Core to mission and flagship programs"};
function heatLegend(){return '<div class="hleg">'+[1,2,3,4,5].map(function(k){return '<span><i class="sc sc'+k+'">'+k+'</i>'+esc(RUB[k])+'</span>';}).join("")+'<span><i class="sc" style="background:var(--panel);color:var(--muted)">n/s</i>Not scored</span></div>';}
function domLegend(){return '<div class="legend">'+DOMAINS.map(function(d){return '<span><i style="background:'+DCOL[d]+'"></i>'+d+'</span>';}).join("")+'</div>';}
function simpleTable(t,opt){opt=opt||{};return '<div class="stw"><table class="st"><thead><tr>'+t.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join("")+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(v,i){return '<td'+(num(v)?' class="n"':'')+'>'+renderCell(t.headers[i],v)+'</td>';}).join("")+'</tr>';}).join("")+'</tbody></table></div>';}
function dataDetails(t,label){return '<details class="data"><summary>'+esc(label||"Show the data table")+'</summary>'+simpleTable(t)+'</details>';}

/* ---------- master records & profile ---------- */
var GRA=sheet("GRA Master Mapping"),ACAN=sheet("ACAN Master Mapping"),LOG=sheet("Research and Verification Log");
var REC={};
[GRA,ACAN].forEach(function(s){objRows(s).forEach(function(o){o.__sheet=s.name;REC[o["Organisation ID"]]=o;});});
var LOGBY={};objRows(LOG).forEach(function(o){LOGBY[o["Organisation ID"]]=o;});
var GROUPS=[
 ["Identity",["Serial No.","Organisation ID","Organisation Name","Alternative / Former Names","Entity Type","GRA Serial Position","Relationship to GRA","Country / Headquarters","Geographic Scope","Year Started / Founded","Registered / Legal Status","Legal Status Evidence"]],
 ["About the organisation",["Information About the Organisation","Operating Space","Principal Population Served","Primary Organisational Function","Resuscitation / Cardiac Arrest Relevance"]],
 ["Formula for Survival scores",["Implementation Score (1-5)","Education Score (1-5)","Science Score (1-5)","Advocacy Score (1-5)","Survivorship Score (1-5)","Breadth Score","Domains Active","Primary Domain","Secondary Domain","Formula for Survival Role","Contribution Across Formula for Survival","Evidence for Classification","Research Confidence"]],
 ["Relevance and overlaps",["Relevance to GRA","Relevance to ACAN","Overlaps with GRA Programs","Overlaps within ACAN","Key Programs, Assets and Resources"]],
 ["Mission and Vision",["Mission","Vision","Mission Source URL","Vision Source URL","Mission Availability","Vision Availability","Mission and Vision Research Notes"]],
 ["Official website",["Official Website","Website Verification Status","Website Verification Evidence","Supplied Website (Reference List)","Website Change Note","Date Last Verified"]],
 ["Sources and review",["Outstanding Research Issue","Key Sources","Conflict / Uncertainty Notes","Classification Review Needed","Suggested Review Question"]]
];
var lastFocus=null;
function kvRow(h,v){
  var out;
  if(h==="Mission"||h==="Vision"){out='<div class="stmt'+(/^(Not publicly|Unable to verify)/.test(v)?' none':'')+'">'+esc(v)+'</div>';}
  else out=renderCell(h,v).replace('<div class="cl">','<div>');
  return '<dt>'+esc(h)+'</dt><dd>'+(out||'<span class="muted">Blank</span>')+'</dd>';
}
function openOrg(id,noHash){
  var o=REC[id];if(!o)return;
  if(!$("#drawer").classList.contains("on"))lastFocus=document.activeElement;
  var used={},html='<h2 id="d-name">'+esc(o["Organisation Name"])+'</h2><p class="d-meta">'+esc(o.__sheet)+', number '+esc(o["Serial No."])+'. ID '+esc(id)+'.</p>';
  GROUPS.forEach(function(g){var keys=g[1].filter(function(h){return h in o;});if(!keys.length)return;
    html+='<div class="d-grp"><h3>'+g[0]+'</h3>';
    if(g[0]==="Formula for Survival scores"){html+='<div class="sbars">'+DOMAINS.map(function(d){var v=o[d+" Score (1-5)"];return '<span>'+d+'</span><span class="tr"><span class="fl" style="display:block;width:'+(num(v)?v*20:0)+'%;background:'+DCOL[d]+'"></span></span><span><b>'+(num(v)?v:"n/s")+'</b></span>';}).join("")+'</div>';}
    html+='<dl class="kv">'+keys.map(function(h){used[h]=1;return kvRow(h,o[h]);}).join("")+'</dl></div>';});
  var rest=Object.keys(o).filter(function(h){return h.indexOf("__")!==0&&!used[h];});
  if(rest.length)html+='<div class="d-grp"><h3>Other fields</h3><dl class="kv">'+rest.map(function(h){return kvRow(h,o[h]);}).join("")+'</dl></div>';
  var lg=LOGBY[id];
  if(lg){html+='<div class="d-grp"><h3>Research and Verification Log</h3><dl class="kv">'+["Research Round","Previous GRA No. (to Oct 2026)","Website Identity Check","Mission Original Heading","Vision Original Heading","Previous Mission (Sep 2026 workbook)","Previous Vision (Sep 2026 workbook)","Outstanding Issue Category","Scores Sep 2026 (I, E, S, A, Sv)","Scores Nov 2026 (I, E, S, A, Sv)","Score Change Note","Scoring Sources Checked"].filter(function(h){return lg[h]!=null&&lg[h]!=="";}).map(function(h){return kvRow(h,lg[h]);}).join("")+'</dl>';
    if(lg["Same Organisation As"])html+='<p>Also listed as <button class="linkbtn" data-org="'+esc(lg["Same Organisation As"])+'">'+esc(REC[lg["Same Organisation As"]]["Organisation Name"])+' ('+esc(lg["Same Organisation As"])+')</button></p>';
    html+='</div>';}
  $("#d-body").innerHTML=html;
  $("#d-pill").innerHTML=statusPill(o["Website Verification Status"]);
  $("#scrim").classList.add("on");$("#drawer").classList.add("on");$("#drawer").focus();
  if(!noHash){var h="#/org/"+id;if(location.hash!==h)history.pushState(null,"",h);}
}
function closeOrg(noHash){if(!$("#drawer").classList.contains("on"))return;$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");
  if(!noHash&&/^#\/org\//.test(location.hash))history.pushState(null,"",slug(cur));if(lastFocus&&lastFocus.focus)lastFocus.focus();}
$("#d-close").addEventListener("click",function(){closeOrg();});
$("#scrim").addEventListener("click",function(){closeOrg();});
$("#d-print").addEventListener("click",function(){document.body.classList.add("pp");window.print();});
window.addEventListener("afterprint",function(){document.body.classList.remove("pp");});
document.addEventListener("keydown",function(e){var on=$("#drawer").classList.contains("on");
  if(e.key==="Escape"&&on)closeOrg();
  if(e.key==="Tab"&&on){var f=$$("#drawer button,#drawer a[href]");if(!f.length)return;var a=f[0],z=f[f.length-1];if(e.shiftKey&&(document.activeElement===a||document.activeElement===$("#drawer"))){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
document.addEventListener("click",function(e){var b=e.target.closest("[data-org]");if(b){e.preventDefault();openOrg(b.getAttribute("data-org"));}});

/* ---------- global search ---------- */
var gq=$("#gq"),gres=$("#gres"),gsel=-1;
function gRender(){var q=gq.value.trim().toLowerCase();if(!q){gres.classList.remove("open");gq.setAttribute("aria-expanded","false");return;}
  var hits=Object.keys(REC).map(function(k){return REC[k];}).filter(function(o){return [o["Organisation Name"],o["Alternative / Former Names"],o["Organisation ID"],o["Official Website"]].join(" ").toLowerCase().indexOf(q)>=0;}).slice(0,30);gsel=-1;
  gres.innerHTML=hits.length?hits.map(function(o){return '<button role="option" data-g="'+esc(o["Organisation ID"])+'">'+esc(o["Organisation Name"])+'<small>'+esc(o["Organisation ID"])+', '+esc(host(o["Official Website"]||""))+'</small></button>';}).join(""):'<button disabled>No organisation matches. Try part of the name, the ID or the website.</button>';
  gres.classList.add("open");gq.setAttribute("aria-expanded","true");}
gq.addEventListener("input",gRender);
gq.addEventListener("keydown",function(e){var it=$$("button[data-g]",gres);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!it.length)return;gsel=(gsel+(e.key==="ArrowDown"?1:-1)+it.length)%it.length;it.forEach(function(b,i){b.classList.toggle("act",i===gsel);});it[gsel].scrollIntoView({block:"nearest"});}
  else if(e.key==="Enter"){var b=it[gsel>=0?gsel:0];if(b){e.preventDefault();gres.classList.remove("open");openOrg(b.getAttribute("data-g"));}}
  else if(e.key==="Escape")gres.classList.remove("open");});
gres.addEventListener("click",function(e){var b=e.target.closest("button[data-g]");if(b){gres.classList.remove("open");openOrg(b.getAttribute("data-g"));}});
document.addEventListener("click",function(e){if(!e.target.closest(".gsearch"))gres.classList.remove("open");});

/* ---------- views ---------- */
var V=$("#view");
function head(s,sub){return '<h1>'+esc(s.name)+'</h1>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'');}
var PRESETS={
 "Key columns":["Serial No.","Organisation ID","Organisation Name","Entity Type","Country / Headquarters","Primary Domain","Implementation Score (1-5)","Education Score (1-5)","Science Score (1-5)","Advocacy Score (1-5)","Survivorship Score (1-5)","Breadth Score","Domains Active","Official Website","Website Verification Status"],
 "Scores":["Serial No.","Organisation ID","Organisation Name","Primary Domain","Secondary Domain","Implementation Score (1-5)","Education Score (1-5)","Science Score (1-5)","Advocacy Score (1-5)","Survivorship Score (1-5)","Breadth Score","Domains Active","Formula for Survival Role","Contribution Across Formula for Survival","Evidence for Classification","Research Confidence"],
 "Mission and Vision":["Serial No.","Organisation ID","Organisation Name","Mission","Vision","Mission Source URL","Vision Source URL","Mission Availability","Vision Availability","Mission and Vision Research Notes"],
 "Website":["Serial No.","Organisation ID","Organisation Name","Official Website","Website Verification Status","Website Verification Evidence","Supplied Website (Reference List)","Website Change Note","Date Last Verified"]
};
var R={};
R.overview=function(s){
  var d=s.dashboard,rows=d.rows,byM={};rows.forEach(function(r){byM[r[0]]=r;});
  function t(m,label,sub){var r=byM[m];if(!r)return "";return '<div class="tile"><div class="v">'+fmt(r[4])+'</div><div class="l">'+esc(label||m)+'</div><div class="s">'+(sub||("GRA "+fmt(r[2])+", ACAN "+fmt(r[3])))+'</div></div>';}
  var h='<div class="hero"><div class="num">'+fmt(byM["Organisation entries"][4])+'</div><div><h1>'+esc(s.title)+'</h1><p>'+esc(s.intro[0])+'</p><p class="muted">'+esc(s.intro[1])+'</p></div></div>';
  h+='<div class="tiles">'+t("Organisation entries")+t("Unique organisations","Unique organisations","Entries on both lists counted once")+t("Official websites verified")+t("Mission published")+t("Vision published")+t("Entries with outstanding research issues","Open items")+t("Rows not yet scored")+'</div>';
  h+='<p class="statusline">'+esc(s.status[1])+'</p>';
  h+='<section class="blk"><h2>Dashboard</h2><p class="desc">'+esc(s.dash_note)+'</p>'+simpleTable(d)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.findings_title)+'</h2><dl class="find">'+s.findings.map(function(f){return '<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>';}).join("")+'</dl></section>';
  h+='<section class="blk"><h2>'+esc(s.domains_title)+'</h2>'+simpleTable(s.domains)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.burden_title)+'</h2>'+simpleTable(s.burden)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.questions_title)+'</h2>'+simpleTable(s.questions)+'</section>';
  h+='<footer class="foot">Source: '+esc(M.meta.source)+'. Every tab of the workbook is in the left menu, with the same rows and columns.</footer>';
  V.innerHTML=h;
};
R.master=function(s){
  V.innerHTML=head(s,s.rows.length+" organisations and "+s.headers.length+" columns, in list order"+(s.name.indexOf("GRA")===0?" (the five priority organisations first)":"")+". Select a row to open the full profile. Click a column heading to sort.")+'<div id="dt"></div>';
  new DataTable($("#dt"),s,{id:"m",sticky:3,stickyW:[64,96,220],presets:PRESETS,filters:["Entity Type","Primary Domain","Secondary Domain","Research Confidence","Website Verification Status","Mission Availability","Vision Availability","Classification Review Needed"].filter(function(h){return s.headers.indexOf(h)>=0;}),
    onRow:function(r){openOrg(r[s.headers.indexOf("Organisation ID")]);}});
};
R.log=function(s){
  V.innerHTML=head(s,"One row per entry: supplied and final website, verification evidence, Mission and Vision headings and sources, the September 2026 wording, open items and the November score check. Select a row to open the organisation's profile.")+'<div id="dt"></div>';
  new DataTable($("#dt"),s,{id:"l",sticky:2,stickyW:[90,64],filters:["Group","Research Round","Website Verification Status","Mission Availability","Vision Availability","Outstanding Issue Category"],onRow:function(r){openOrg(r[0]);}});
};
R.table=function(s){
  V.innerHTML=head(s,s.rows.length+" rows. Click a column heading to sort; click a long cell to expand it.")+'<div id="dt"></div>';
  var opt={id:"g",sticky:1,stickyW:[220]};
  if(s.name==="Cross-Domain Organisations"){opt.filters=["List","Primary Domain","Domains Active","Still qualifies?"];opt.stickyW=[70];}
  if(s.name==="Group Review - Conflicts")opt.filters=["Priority"];
  if(s.name==="Sources and References"){opt.filters=["Source Type","Source Quality"];}
  if(s.name==="Gap Analysis"){opt.filters=["Gap Classification"];opt.stickyW=[160];}
  new DataTable($("#dt"),s,opt);
};
R.domain_summary=function(s){
  function chart(t,title){var items=t.rows.map(function(r){return {label:r[0],value:r[3],color:DCOL[r[0]],tip:"<b>"+esc(r[0])+"</b><br>Average "+fmt(r[3])+"<br>Scoring 4 or 5: "+r[2]+" of "+r[4]+"<br>Scoring 5: "+r[1]};});return rankedBars(items,{title:title,max:5,step:1,labelW:130});}
  V.innerHTML=head(s,s.note)+'<section class="blk"><h2>'+esc(s.t1_title)+'</h2><p class="desc">Average score by domain. Hover a bar for the counts.</p>'+chart(s.t1,s.t1_title)+simpleTable(s.t1)+'</section><section class="blk"><h2>'+esc(s.t2_title)+'</h2><p class="desc">Average score by domain. Hover a bar for the counts.</p>'+chart(s.t2,s.t2_title)+simpleTable(s.t2)+'</section><p class="sub">'+esc(s.foot)+'</p>';
};
R.heat_data=function(s){
  V.innerHTML=head(s,"The score grid every chart reads from: GRA rows first, then ACAN, in list order. Scores are shaded from 1 (light) to 5 (dark).")+heatLegend()+'<div id="dt"></div>';
  new DataTable($("#dt"),s,{id:"h",sticky:3,stickyW:[60,60,240],filters:["List","Primary Domain","Domains Active"]});
};
R.heat_chart=function(s){
  function rowsOf(t,off){var H=t.headers;return t.rows.map(function(r){return {label:r[1],scores:[r[2],r[3],r[4],r[5],r[6]],id:findId(r[1],off)};});}
  function findId(name,grp){for(var k in REC){if(REC[k]["Organisation Name"]===name&&REC[k].__sheet.indexOf(grp)===0)return k;}return null;}
  var all=sheet("Heat Map Data"),Hh=all.headers;
  var acanAll=all.rows.filter(function(r){return r[0]==="ACAN";}).map(function(r){return {label:r[2],scores:[r[4],r[5],r[6],r[7],r[8]],id:findId(r[2],"ACAN")};});
  var h=head(s,s.note)+heatLegend();
  h+='<section class="blk"><h2>'+esc(s.c1_title)+'</h2><p class="desc">Select a name to open its profile.</p>'+heatmap(rowsOf(s.c1,"GRA"),{first:"GRA organisation"})+'</section>';
  h+='<section class="blk"><h2>'+esc(s.c2_title)+'</h2>'+heatmap(rowsOf(s.c2,"ACAN"),{first:"ACAN organisation"})+'<details class="data"><summary>Show all 100 ACAN organisations</summary>'+heatmap(acanAll,{first:"ACAN organisation"})+'</details></section>';
  h+='<section class="blk"><h2>'+esc(s.d1_title)+'</h2><div id="d1"></div></section><section class="blk"><h2>'+esc(s.d2_title)+'</h2><div id="d2"></div></section>';
  V.innerHTML=h;
  new DataTable($("#d1"),{name:s.name+" data 1",headers:s.d1.headers,rows:s.d1.rows},{id:"hd1",filters:["Primary Domain"],file:"Heat-Map-Chart-GRA"});
  new DataTable($("#d2"),{name:s.name+" data 2",headers:s.d2.headers,rows:s.d2.rows},{id:"hd2",filters:["Primary Domain"],file:"Heat-Map-Chart-ACAN-top-25"});
};
R.dataviz=function(s){
  var h=head(s,"The six charts from the workbook, drawn from the same tables. Hover any mark for its value; each chart has its data table underneath.");
  h+='<section class="blk"><h2>'+esc(s.A_title)+'</h2><p class="desc">Breadth Score is the sum of the five domain scores (maximum 25).</p>'+rankedBars(s.A.rows.map(function(r){return {label:r[1],value:r[2],color:"var(--gra)",tip:"<b>"+esc(r[1])+"</b><br>Rank "+r[0]+", Breadth "+r[2]};}),{title:s.A_title,max:25,step:5})+dataDetails(s.A)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.B_title)+'</h2><p class="desc">Each bar is split into the five domains, in fixed order.</p>'+domLegend()+stackedBars(s.B.rows.map(function(r){return {label:r[0],values:r.slice(1,6)};}),{title:s.B_title})+dataDetails(s.B)+'</section>';
  var C=s.C,orgs=C.rows[0].slice(1);
  h+='<section class="blk"><h2>'+esc(s.C_title)+'</h2><p class="desc">One small chart per organisation, same scale, so the profiles compare directly.</p><div class="mult">'+orgs.map(function(o,i){var vals=C.rows.slice(1).map(function(r){return r[i+1];});return '<div><h4>'+esc(C.headers[i+1])+': '+esc(o)+'</h4>'+domainColumns(vals,{title:o,name:o})+'</div>';}).join("")+'</div>'+dataDetails(C)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.D_title)+'</h2>'+rankedBars(s.D.rows.map(function(r){return {label:r[0],value:r[1],color:DCOL[r[0]],tip:"<b>"+esc(r[0])+"</b><br>"+r[1]+" GRA organisations"};}),{title:s.D_title,max:Math.max.apply(null,s.D.rows.map(function(r){return r[1];}))+1,step:2,labelW:130})+dataDetails(s.D)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.E_title)+'</h2>'+groupedBars(s.E.rows.map(function(r){return {label:r[0],a:r[1],b:r[2]};}),{title:s.E_title})+dataDetails(s.E)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.F_title)+'</h2><p class="desc">Each dot is one organisation. Dots with the same values are spread slightly so they can all be seen.</p>'+scatter(s.F.rows.map(function(r){return {list:r[0],label:r[1],x:r[2],y:r[3]};}),{title:s.F_title})+dataDetails(s.F)+'</section>';
  V.innerHTML=h;
};
R.qc=function(s){
  var h=head(s,s.note);
  h+='<section class="blk"><h2>Checks</h2>'+simpleTable(s.checks)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.method_title)+'</h2>'+s.method.map(function(p){return '<p style="max-width:95ch">'+esc(p)+'</p>';}).join("")+'</section>';
  h+='<section class="blk"><h2>'+esc(s.log_title)+'</h2>'+simpleTable(s.changelog)+'</section>';
  h+='<section class="blk"><h2>'+esc(s.rl_title)+'</h2><div id="dt"></div></section>';
  V.innerHTML=h;
  new DataTable($("#dt"),{name:"Quality Control row checks",headers:s.rowlevel.headers,rows:s.rowlevel.rows},{id:"q",sticky:1,stickyW:[240],filters:["List","Unable to verify (1 = yes)","Review flag","Fully scored","Website status"]});
};

/* ---------- navigation ---------- */
var GROUPN={"Overview":"Summary","GRA Master Mapping":"Master tabs","Research and Verification Log":"Master tabs","Domain Summary":"Analysis","Quality Control":"Quality and sources"};
var rail=$("#rail"),rh="";var lastG="";
SH.forEach(function(s,i){var g=GROUPN[s.name]||lastG;if(g!==lastG){rh+='<div class="grp">'+g+'</div>';lastG=g;}
  var n=s.rows?s.rows.length:"";rh+='<a href="'+slug(i)+'" data-i="'+i+'">'+esc(s.name)+(n!==""?' <b>'+n+'</b>':'')+'</a>';});
rh+='<p class="note">Data from the workbook, last verified '+esc(M.meta.verified)+'. Works offline; website links need an internet connection.</p>';
rail.innerHTML=rh;
var cur=0;
function show(i){if(!SH[i])i=0;cur=i;var s=SH[i];$$("a[data-i]",rail).forEach(function(a){if(+a.getAttribute("data-i")===i)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  $("#ph").textContent="GRA and ACAN Master Mapping: "+s.name+". Verified "+M.meta.verified+".";
  (R[s.kind]||R.table)(s);window.scrollTo(0,0);}
function route(){var h=location.hash;var m=h.match(/^#\/org\/(.+)$/);if(m){if(!V.innerHTML)show(0);openOrg(decodeURIComponent(m[1]),true);return;}
  closeOrg(true);var t=h.match(/^#\/t\/(\d+)$/);show(t?+t[1]:0);}
window.addEventListener("hashchange",route);window.addEventListener("popstate",route);
route();
})();
