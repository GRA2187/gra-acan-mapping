g Centre on Integrated Clinical Care, Department of Family, Community and Emergency Care, University of Cape Town",16,2],["ACAN","World Federation of Critical Care Nurses",13,1],["ACAN","World Association of Disaster and Emergency Medicine",15,2],["ACAN","World Coalition for Trauma Care",9,0],["ACAN","World Federation of Intensive and Critical Care",11,0],["ACAN","World Federation of Neurosurgical Societies",13,1],["ACAN","World Federation of Paediatric Intensive and Critical Care Societies",16,3],["ACAN","World Federation of Societies of Anaesthesiologists",18,3],["ACAN","World Organization of Family Doctors",16,2],["ACAN","World Stroke Organization",22,5]]}},{"name":"Cross-Domain Organisations","kind":"table","title":null,"headers":["List","Serial No.","Organisation Name","Primary Domain","Bridge Pattern","Domains Active","Breadth Score","Still qualifies?","Strategic Relevance","Evidence"],"rows":[["GRA",1,"Global Resuscitation Alliance","Implementation","Implementation + Education + Advocacy",3,19,"Yes","This is the GRA itself. Every other row on this tab is read against its mission and its 50 percent survival target.","I5: Ten Programs to Improve Survival with case studies, Ten Steps for in-facility neonatal resuscitation, and regional alliances in North America, Europe, Asia and Australia/New Zealand. E4: Resuscitation Academy affiliate and GRA webinar series (for example 'A Decade of Transforming Resuscitation Care', April 2025). S3: Utstein Formula of Survival, Utstein on Stroke and ILCOR's 10 Steps for in-hospital arrest; no primary research or registry of its own. A4: Call to Action with AHA, Laerdal and the Resuscitation Academy; public goal of a 50% rise in survival. Sv3: Survival rate is the stated, measured outcome; no recovery or survivor support program found."],["GRA",4,"American Heart Association","Education","Implementation + Education + Science + Advocacy + Survivorship",5,24,"Yes","Founding partner of the GRA and a listed affiliate. Its RQI program with Laerdal is one of the main routes for high-quality CPR training.","I5: Hospital quality programs (Get With The Guidelines) and RQI resuscitation quality programs. E5: 22 million people trained in CPR each year. S5: More than $6 billion invested in research; ECC guidelines. A5: You're the Cure advocate network and public policy work. Sv4: 'Sudden Cardiac Arrest Survivorship: A Scientific Statement From the American Heart Association' (Circulation, 2020) and the Support Network for patients, survivors and caregivers."],["GRA",5,"Citizen CPR Foundation","Education","Implementation + Education + Advocacy",3,17,"Yes","HEARTSafe and the Summit are natural US channels for GRA community programs such as telephone CPR and AED networks.","I4: HEARTSafe Community with 600+ communities committed to AED access, CPR training and response protocols; Lifesaving Strategies (CPR in Schools, Dispatch CPR, In-Hospital Strategies). E4: Cardiac Arrest Survival Summit every two years since 1985; Learn CPR and AED and Resuscitation Leadership programs. S2: Shares science at the Summit; no research of its own. A4: Mission is citizen and community action and advocacy; HEARTSafe drives local commitments. Sv3: Survivors are a named Summit audience; no recovery program of its own."],["GRA",8,"Society of Critical Care Medicine","Education","Implementation + Education + Science + Survivorship",4,20,"Yes","Brings the in-hospital and post-resuscitation end of the chain. The Laerdal Foundation-funded sepsis program for low-resource settings (2024) makes SCCM a natural partner for GRA in-hospital work.","I4: Global Health programs and a seven-year sepsis program across 20 regions with Laerdal Foundation support. E5: Critical care education for over 50 years; Fundamental Critical Care Support (FCCS). S4: Critical Care Medicine journal and research activity. A3: Advocacy named as a core activity; Right Care, Right Now. Sv4: THRIVE post-ICU recovery collaboratives (peer support and follow-up clinics), published as 'Key mechanisms by which post-ICU activities can improve in-ICU care'."],["GRA",9,"World Stroke Organization","Advocacy","Implementation + Education + Science + Advocacy + Survivorship",5,22,"Yes","'Utstein on Stroke' is listed as a GRA affiliate. WSO shows how a disease body can hold survivorship and advocacy together, which is where the GRA list is thin.","I4: WSO Stroke Center Certification for hospitals and the Roadmap to Delivering Quality Stroke Care that goes with the Global Stroke Services Guideline and Action Plan. E4: World Stroke Academy and its webinar series. S4: International Journal of Stroke, World Stroke Congress (Rio de Janeiro 2027) and the Global Stroke Fact Sheet. A5: World Stroke Day (#ActFAST), World Stroke Campaign, Global Stroke Action Coalition and WSO policy statements. Sv5: Stroke support organisation (SSO) capacity strengthening, SSO Global Mapping, Stroke Connector, survivor stories and lay membership."],["GRA",10,"European Resuscitation Council","Education","Implementation + Education + Science + Advocacy + Survivorship",5,22,"Yes","The European counterpart to AHA on the GRA list. Get Trained Save Lives and EuReCa map straight onto GRA programs for bystander CPR and registries.","I4: EuReCa registry studies across National Resuscitation Councils (Sept 2026 check) and equipment donation to Mount Meru Regional Referral Hospital, Tanzania. E5: CPR courses across Europe through the course calendar; more than 363,000 people in 2024 (President's message); webinars such as 'Disseminating CPR in the community'. S5: ERC Guidelines 2025 and Resuscitation 2026 congress in Milan (1,362 participants, 75 countries). A4: Pass The Pulse campaign for World Restart a Heart, plus Get Trained Save Lives and EU policy work (Sept 2026 check). Sv4: Patient and Family initiative on rehabilitation, psychological support and follow-up (Sept 2026 check; not shown on the homepage)."],["GRA",14,"Sudden Cardiac Arrest Foundation","Advocacy","Education + Advocacy + Survivorship",3,19,"Yes","Brings public awareness reach and a US survivor community the GRA can draw on for its survivorship gap.","I3: AED Deployment, SaveStation AED Contest, Ready to Respond host locations (2026) and the Campus Campaign. E4: SCA Education Toolkits, Awareness Toolkit, videos, Call-Push-Shock and Chain of Survival resources. S3: SCAF Research on public awareness (2015 and 2017 studies) and Survivor/Family Research with current and past projects. A5: Sudden Cardiac Arrest Awareness Month, Call-Push-Shock campaign, It Starts with You pledge, H.E.A.R.T. Champions and position statements. Sv4: Cardiac Arrest Survivor Alliance (CASA), the Survivorship and Co-Survivorship program and survivor stories."],["GRA",15,"American College of Surgeons","Implementation","Implementation + Education + Science + Advocacy",4,20,"Yes","Carries trauma system standards and bleeding control training into the GRA. LFR International (ACAN #59) already uses ACS course content.","I5: Trauma Quality Improvement Program (TQIP) and quality programs in about 2,500 hospitals; trauma centre verification. E5: ATLS and Stop the Bleed, which has trained more than 5 million people (2025), including programs for Ukraine. S4: Clinical registries with more than 50 million patient records. A4: Health Policy and Advocacy Group; Stop the Bleed mandates such as Sudan's driver training rule (2023). Sv2: No survivorship or rehabilitation program found. Checked through press releases on other sites because facs.org limits AI-tool use of its content."],["GRA",16,"International Federation of Red Cross","Education","Implementation + Education + Advocacy",3,19,"Yes","The biggest lay rescuer training network on the GRA list and central to any bystander CPR target in low- and middle-income settings.","I5: All 191 National Societies offer first aid training and services; more than 50 million people reached each year through awareness work. E5: 12.4 million people trained in first aid in 2022 by more than 165,000 trainers; free IFRC online courses. S3: Global First Aid Reference Centre; research and evaluation is a Vision 2030 priority. A4: World First Aid Day and its call for first aid 'accessible to everyone, everywhere'. Sv2: Psychological first aid sits with its psychosocial work; no cardiac arrest survivor work found."],["GRA",17,"African Federation for Emergency Medicine","Advocacy","Implementation + Education + Science + Advocacy",4,18,"Yes","The GRA's strongest African partner. It can shape tools for places where several Chain of Survival links, such as EMS and dispatch, do not yet exist.","I4: Reports 35 projects across 25 countries; develops emergency care policies and frameworks with governments. E4: Education and Training component guides curriculum development across all tiers of the emergency care system. S4: Research component drives a strategic research agenda; publishes the African Journal of Emergency Medicine. A5: 'We advocate for emergency care to be prioritised by global stakeholders'; advocacy is one of its six model components. Sv1: Mortality figures only; no survival or recovery work found."],["GRA",18,"American Academy of Pediatrics","Education","Implementation + Education + Science + Advocacy",4,20,"Yes","Holds the newborn resuscitation training that the GRA's newborn alliance (2024) and in-hospital paediatric alliance depend on.","I4: Helping Babies Survive programs and Global Child Health and Life Support implementation support. E5: Neonatal Resuscitation Program since 1987; Helping Babies Breathe. S4: NRP science draws on the ILCOR neonatal evidence review. A5: Federal and state child health advocacy, including section advocacy pages and the Subspecialty Advocacy Toolkit. Sv2: No resuscitation survivorship program found."],["GRA",21,"European Society for Emergency Medicine","Education","Education + Science + Advocacy",3,16,"Yes","The emergency department link in European resuscitation. Its World Restart a Heart competition and ERC sister status make it an easy GRA ally.","I2: EUSEM actions for Ukraine and paediatric resources for Ukrainian support; no regular country program. E5: EUSEM 2026 Congress (3,700+ delegates), EUSEM Academy, European Curriculum, EBEEM exam, European Trauma Course, EMPOWER and LeadEM programmes. S4: Research Network and Committee, REPEM and the European Journal of Emergency Medicine. A4: EM Day campaign, international survey on violence against emergency workers (81 countries) and the ESCAPE climate network. Sv1: Nothing on survival or recovery."],["GRA",22,"International Confederation of Midwives","Advocacy","Implementation + Education + Advocacy",3,16,"Yes","Midwives deliver newborn resuscitation at many births in low-resource settings, which puts ICM at the centre of the GRA newborn alliance.","I4: Support, leadership development and resources for 100+ midwives' associations; technical consultations such as the Indigenous Communities position statement (Oct 2026). E4: International Definition and Scope of Practice, Essential Competencies for Midwifery Practice and the Professional Framework for Midwifery. S2: Research appears only as a resource category; no research program. A5: PUSH campaign for woman-centred care and human rights advocacy. Sv1: No survival outcome or post-birth program named."],["ACAN",1,"African Federation for Emergency Medicine","Advocacy","Implementation + Education + Science + Advocacy",4,18,"Yes","ACAN's anchor for African emergency care systems; its six-part model covers most ACAN themes except survivorship.","I4: Reports 35 projects across 25 countries; develops emergency care policies and frameworks with governments. E4: Education and Training component guides curriculum development across all tiers of the emergency care system. S4: Research component drives a strategic research agenda; publishes the African Journal of Emergency Medicine. A5: 'We advocate for emergency care to be prioritised by global stakeholders'; advocacy is one of its six model components. Sv1: Mortality figures only; no survival or recovery work found."],["ACAN",3,"Aga Khan University Center of Excellence for Trauma and Emergencies","Education","Implementation + Education + Science",3,17,"Yes","Brings trauma and emergency care into the ACAN network.","I4: Pakistan Life Savers Programme (national movement to train 10 million people in CPR and bleeding control), Heat Action Plans in five Sindh cities (2025), disaster response and third-party EMT evaluation. E5: Pakistan Life Support Course (the country's first locally developed life support course), Medical First Responder, Leadership in Resuscitation and Disaster Leadership courses; CETE Global Lecture Series. S4: Trauma Registry, iRise, FEAMER, Equi Injury and Connect-HTN research projects. A3: Advocated for a heatwave management plan with the provincial disaster authority (2024). Sv1: No rehabilitation or survivor follow-up found."],["ACAN",5,"American Academy of Pediatrics","Education","Implementation + Education + Science + Advocacy",4,20,"Yes","ACAN's main paediatric and newborn member; brings neonatal resuscitation into an adult-heavy network.","I4: Helping Babies Survive programs and Global Child Health and Life Support implementation support. E5: Neonatal Resuscitation Program since 1987; Helping Babies Breathe. S4: NRP science draws on the ILCOR neonatal evidence review. A5: Federal and state child health advocacy, including section advocacy pages and the Subspecialty Advocacy Toolkit. Sv2: No resuscitation survivorship program found."],["ACAN",6,"American Association for the Surgery of Trauma","Science","Implementation + Education + Science",3,18,"Yes","Brings trauma, acute care surgery and surgical critical care into the ACAN network.","I4: Emergency General Surgery Verification Program, co-developed with ACS, to help hospitals build emergency general surgery services; Society of Acute Care Surgery Chiefs. E4: Acute care surgery fellowships, Emergency Surgery Course, AAST annual meeting (86th, Chicago 2027) and Leadership Academy. S5: AAST Multi-Institutional Studies, research funding and the Journal of Trauma and Acute Care Surgery. A3: Injury Prevention Resources and a Violence Prevention Guide. Sv2: Geriatric Hip Fractures clinical guide covers recovery expectations; no survivor program."],["ACAN",7,"American Heart Association","Education","Implementation + Education + Science + Advocacy + Survivorship",5,24,"Yes","The highest-scoring ACAN member across the five domains; sets resuscitation guidelines and runs CPR training at scale.","I5: Hospital quality programs (Get With The Guidelines) and RQI resuscitation quality programs. E5: 22 million people trained in CPR each year. S5: More than $6 billion invested in research; ECC guidelines. A5: You're the Cure advocate network and public policy work. Sv4: 'Sudden Cardiac Arrest Survivorship: A Scientific Statement From the American Heart Association' (Circulation, 2020) and the Support Network for patients, survivors and caregivers."],["ACAN",8,"AO Alliance Foundation","Education","Implementation + Education + Advocacy",3,18,"Yes","Covers fracture and orthopaedic trauma care for ACAN.","I4: Works in 30+ low- and middle-income countries in Africa and Asia, with named activity in Solomon Islands, Burkina Faso and Tanzania (Shirati bonesetter project). E5: 2,035 educational events, 59,204 health workers trained and 681 fellowships sponsored; Faculty Education Training (Ouagadougou 2026). S3: Clinical Research program and clinical guidelines. A4: Awareness and Policy program that helps craft national trauma plans. Sv2: National trauma plans run 'from prevention to rehabilitation'; no rehabilitation program of its own."],["ACAN",12,"Australasian College for Emergency Medicine","Education","Implementation + Education + Science + Advocacy",4,19,"Yes","Brings emergency medicine training and ED standards into the ACAN network.","I4: Quality Standards and Resource Toolkit, training site accreditation standards, Rural Health Action Plan 2025-2027 and Global Emergency Care programs including the WHO-ICRC-IFEM Basic Emergency Care course. E5: FACEM Training Program, associateship programs (pre-hospital and retrieval, foundational, intermediate and advanced EM) and CPD. S4: Emergency Medicine Australasia journal, ACEM Foundation grants, Clinical Trials Network and ED Epidemiology Network. A4: Access Block work, 'Breaking Point' call to action and State of Emergency reports (2026). Sv2: Australia and Aotearoa New Zealand Emergency Registry (AANZER) under 'Better Outcomes for Patients'."],["ACAN",13,"Australian and New Zealand Intensive Care Society","Science","Implementation + Science + Survivorship",3,19,"Yes","ACAN member focused on intensive care quality, registries and trials.","I4: CORE ICU Registry audit and benchmarking across Australia and New Zealand, Safety and Quality program and the public ICU Dashboard. E3: Conferences (Safety and Quality 2026, APICS 2027), Education Committee and the Alfred-ANZICS research fellowship. S5: Clinical Trials Group research network and an ICU registry of about 4 million records. A3: Advocacy committees (Global Health, Professional Activities and Welfare, Women in Intensive Care) and clinical guidance. Sv4: 'My Life After ICU' support after critical illness, patient and carer surveys, and patient-reported outcome research."],["ACAN",23,"European Society for Emergency Medicine","Education","Education + Science + Advocacy",3,16,"Yes","ACAN's European emergency medicine society.","I2: EUSEM actions for Ukraine and paediatric resources for Ukrainian support; no regular country program. E5: EUSEM 2026 Congress (3,700+ delegates), EUSEM Academy, European Curriculum, EBEEM exam, European Trauma Course, EMPOWER and LeadEM programmes. S4: Research Network and Committee, REPEM and the European Journal of Emergency Medicine. A4: EM Day campaign, international survey on violence against emergency workers (81 countries) and the ESCAPE climate network. Sv1: Nothing on survival or recovery."],["ACAN",29,"Global Resuscitation Alliance","Implementation","Implementation + Education + Advocacy",3,19,"Yes","Brings a tested community implementation model into ACAN, which is otherwise strongest on facility and system care.","I5: Ten Programs to Improve Survival with case studies, Ten Steps for in-facility neonatal resuscitation, and regional alliances in North America, Europe, Asia and Australia/New Zealand. E4: Resuscitation Academy affiliate and GRA webinar series (for example 'A Decade of Transforming Resuscitation Care', April 2025). S3: Utstein Formula of Survival, Utstein on Stroke and ILCOR's 10 Steps for in-hospital arrest; no primary research or registry of its own. A4: Call to Action with AHA, Laerdal and the Resuscitation Academy; public goal of a 50% rise in survival. Sv3: Survival rate is the stated, measured outcome; no recovery or survivor support program found."],["ACAN",37,"International Association for Hospice and Palliative Care","Advocacy","Education + Science + Advocacy",3,19,"Yes","ACAN member focused on palliative care.","I3: Program Support under its advocacy work. E4: Courses, Scholarship Program, Pallitalks webinars, Pallipedia and Palliative Care Reference Cards from its interdisciplinary curriculum. S4: Consensus-based definition of palliative care, Essential Palliative Care Packages, Global Palliative Care Database, Opioid Price Watch and the Manual of Palliative Care (3rd edition). A5: Advocacy Program at WHO, 'Help your government improve access to pain treatment!' call, Interfaith Palliative Care Advocacy Network and LEAD Program. Sv3: Its definition of palliative care centres on quality of life for patients, families and caregivers."],["ACAN",38,"International Association for the Study of Pain","Science","Education + Science + Advocacy",3,19,"Yes","Covers pain research and care for ACAN.","I3: National, regional and global pain initiatives and the free Guide to Pain Management in Low-Resource Settings. E4: Core Curriculum for Professional Education in Pain, PERC online learning, pain schools and camps and a global mentoring pilot. S5: PAIN and PAIN Reports journals, Pain Research Forum, 2026 World Congress on Pain and the ICD-11 chronic pain classification. A4: Global Year campaigns (Neuropathic Pain 2026), IASP statements, Declaration of Montreal and GAPPA. Sv3: Resources for Living with Pain and RELIEF News for people with chronic pain; no rehabilitation program of its own."],["ACAN",44,"International Committee of the Red Cross","Implementation","Implementation + Education + Advocacy + Survivorship",4,21,"Yes","Covers conflict-zone trauma care, first aid and rehabilitation for ACAN.","I5: Hospital, first aid and emergency care support in conflict settings reported in country facts and figures (for example Ethiopia, first half of 2026). E4: WHO-ICRC Basic Emergency Care course and war surgery training. S3: War surgery and first aid manuals. A5: Mandate under international humanitarian law and the Health Care in Danger initiative. Sv4: Physical Rehabilitation Programme with a 2024 worldwide annual report on mobility, sport and social inclusion."],["ACAN",45,"International Confederation of Midwives","Advocacy","Implementation + Education + Advocacy",3,16,"Yes","ACAN's global midwifery federation.","I4: Support, leadership development and resources for 100+ midwives' associations; technical consultations such as the Indigenous Communities position statement (Oct 2026). E4: International Definition and Scope of Practice, Essential Competencies for Midwifery Practice and the Professional Framework for Midwifery. S2: Research appears only as a resource category; no research program. A5: PUSH campaign for woman-centred care and human rights advocacy. Sv1: No survival outcome or post-birth program named."],["ACAN",51,"International Federation of the Red Cross and Red Crescent Societies","Education","Implementation + Education + Advocacy",3,19,"Yes","ACAN's largest first aid and community response network.","I5: All 191 National Societies offer first aid training and services; more than 50 million people reached each year through awareness work. E5: 12.4 million people trained in first aid in 2022 by more than 165,000 trainers; free IFRC online courses. S3: Global First Aid Reference Centre; research and evaluation is a Vision 2030 priority. A4: World First Aid Day and its call for first aid 'accessible to everyone, everywhere'. Sv2: Psychological first aid sits with its psychosocial work; no cardiac arrest survivor work found."],["ACAN",59,"Lay First Responders International","Implementation","Implementation + Education + Science",3,16,"Yes","ACAN's clearest community first-responder implementer in low-resource settings.","I5: 7,905 lay first responders trained in 8 programs across Sierra Leone, Uganda, Nigeria, Kenya, Guatemala and Chad, at $16.32 per trainee. E4: LFR model curricula and the LFR Fellowship. S4: Published evaluations, including 'Developing a lay first responder program in Chad' (Prehospital and Disaster Medicine) and papers in World Journal of Surgery, AfJEM, TSACO and EMJ. A2: Presentations to community leaders, ACS and the World Trauma Congress, and a royal award for post-crash response. Sv1: 12-month program evaluation in Chad, but no patient follow-up or rehabilitation."],["ACAN",62,"Médecins Sans Frontières","Implementation","Implementation + Education + Science + Advocacy",4,21,"Yes","Covers humanitarian emergency medical care for ACAN.","I5: Projects in 72 countries with 17.1 million outpatient consultations and 1.8 million admissions (International Activity Report 2025), including Ebola, Sudan, Gaza, Haiti and Ukraine responses. E4: MSF Academy for Healthcare for locally hired staff, MSF Paediatric Days and CRASH internal training. S4: Epicentre, LuxOR operational research, evaluation units, the MSF Science Portal and MSF Medical Guidelines. A5: MSF Access and frequent public statements (for example on attacks on medical care, Nov 2026). Sv3: Mental health support for Ebola patients and families (Oct 2026) and services for sexual violence survivors in Goma."],["ACAN",63,"National Intensive Care Surveillance MORU","Science","Implementation + Education + Science",3,19,"Yes","Brings iCU registries and quality into the ACAN network.","I5: National electronic ICU registry for Sri Lanka with the Ministry of Health and ICTA, and the CCAA network of ICU registries in 18 countries across Asia and Africa (300+ ICUs, 600,000+ patient episodes). E4: Train the Trainer programmes that reached nearly 25% of Sri Lanka's critical care nursing workforce. S5: Registry-embedded trials Mega-ROX, Mega-ROX Sepsis, Mega-ROX Brains and REMAP-CAP, with publications in Critical Care and Wellcome Open Research. A2: Government-backed national model; no advocacy campaign. Sv3: Registry records ICU outcomes; no follow-up program."],["ACAN",64,"National Association of EMS Physicians","Education","Implementation + Education + Science + Advocacy",4,17,"Yes","ACAN member focused on eMS medical direction.","I4: Prehospital Guidelines Consortium and EMS medical oversight guidance. E4: Foundations of Medical Oversight Course (FOMOC), year-long Quality and Safety Course, certification review courses and fellowships. S4: Prehospital Emergency Care journal and the E. Brooke Lerner Research Fund. A4: Position statements, a Legislative Action Center and the NAEMSP PAC. Sv1: Nothing found."],["ACAN",66,"Operation Smile","Implementation","Implementation + Education + Advocacy + Survivorship",4,20,"Yes","Brings cleft surgery and surgical workforce into the ACAN network.","I5: 600,000+ patients treated by 6,000+ volunteers in 37 countries, with long-running programs such as Vietnam (75,000+ patients since 1989) and the Philippines (45,000+ since 1982). E4: Training doctors, nurses and whole surgical teams; Women in Medicine program (Morocco) and student programs. S3: Research on cleft development and a thought leadership section. A4: Policy and Advocacy work with governments, Operation 100 and presence at the 77th World Health Assembly. Sv4: Comprehensive cleft care 'Surgery and Beyond' with speech therapy, psychosocial and nutrition support, and a Cleft Community Resource Hub."],["ACAN",70,"RCSI Institute of Global Surgery","Education","Implementation + Education + Science",3,16,"Yes","ACAN member focused on global surgery research and training.","I4: RCSI/COSECSA Collaboration Programme (Irish Aid), Akazi breast cancer programme in Malawi, a water, climate and maternal health project in Guatemala and the SURG-Water project. E4: Postgraduate surgical masters and diplomas, International Surgical Training Fellowship, paediatric anaesthesia and perioperative nursing e-learning (with Kids OR, Smile Train and Operation Smile) and the SELF mentorship programme. S4: Funded research projects (Research Ireland: SURG-Water, Akazi). A3: Member of the G4 Alliance and linked to the UN Global Surgery Learning Hub; no policy work of its own named. Sv1: Nothing found."],["ACAN",73,"Society for Critical Care Medicine","Education","Implementation + Education + Science + Survivorship",4,20,"Yes","One of ACAN's anchor critical care societies.","I4: Global Health programs and a seven-year sepsis program across 20 regions with Laerdal Foundation support. E5: Critical care education for over 50 years; Fundamental Critical Care Support (FCCS). S4: Critical Care Medicine journal and research activity. A3: Advocacy named as a core activity; Right Care, Right Now. Sv4: THRIVE post-ICU recovery collaboratives (peer support and follow-up clinics), published as 'Key mechanisms by which post-ICU activities can improve in-ICU care'."],["ACAN",77,"Sunnybrook Health Sciences, University of Toronto","Implementation","Implementation + Education + Science",3,17,"Yes","Covers trauma, critical care and hospital care for ACAN.","I4: Tory Trauma Program, a major adult trauma centre with a 2025 strategic plan. E4: University of Toronto teaching hospital with trauma fellowships. S4: Tory Trauma Research program. A2: No advocacy found. Sv3: Trauma rehabilitation services (Sept 2026 background; the hospital site blocks automated reading)."],["ACAN",78,"The George Institute for Global Health","Science","Implementation + Science + Advocacy",3,19,"Yes","Brings clinical trials and health systems research into the ACAN network.","I4: SMARThealth Pregnancy in rural India, community day care centres to prevent child drowning, adolescent mental health care in urban slums and sodium reduction in Vietnam. E3: Leadership course for early-career mental health professionals, webinars and the CREST training centre. S5: Large research programs and trials, including INTERACT3 for brain haemorrhage. A4: Policy statements, the Vietnamese sodium consensus statement and anti-stigma campaigns. Sv3: INTERACT3 care bundle raised survival without major disability after brain haemorrhage (2023)."],["ACAN",79,"The Royal College of Emergency Medicine","Education","Implementation + Education + Science + Advocacy",4,18,"Yes","ACAN member focused on emergency medicine training and standards.","I4: Sets and monitors emergency department standards: Guidelines for the Provision of Emergency Medical Services, national QI and audit work, invited service reviews and quality awards. E5: EM curriculum, MRCEM and FRCEM exams, Foundation and Core programmes, ACP credentialing and RCEMLearning. S4: Emergency Medicine Journal, research priorities and a Research Engagement Day (Nov 2026). A4: Emergency Department Crowding work, Safe to Care and RespectED campaigns, an APPG and position statements. Sv1: Nothing on patient recovery after the ED."],["ACAN",83,"WHO Collaborating Centre for Digital Learning in Health Emergencies, ECHO Institute, Health Sciences Center, University of New Mexico","Education","Implementation + Education + Science",3,17,"Yes","Covers emergency, critical and operative care for ACAN.","I5: 9,662 programs run through 1,696 hubs and 42 superhubs in 215 countries and areas, including ECHO Africa, a two-year disease surveillance network in seven African countries and the 2022 Ebola response in Uganda. E5: More than 10 million ECHO session attendances, including community health worker training. S4: More than 900 peer-reviewed papers, a publications dashboard and the 2025 Impact Report. A2: No policy work named. Sv1: Patient stories only."],["ACAN",97,"World Federation of Paediatric Intensive and Critical Care Societies","Education","Education + Science + Advocacy",3,16,"Yes","ACAN member focused on paediatric intensive care.","I3: Pediatric Sepsis Data CoLab, sepsis initiatives and a Global Health Committee; ACAN member. E4: 13th World Congress (2026), support for LMIC delegates on the WHO Basic Critical Care Course, webinar series and OPENPediatrics. S4: Pediatric Critical Care Medicine (official journal), research networks and studies. A4: World PICU Awareness Week and Day (2021-2026); founding member of the Global Sepsis Alliance (GSA site). Sv1: No follow-up or family support program described."],["ACAN",98,"World Federation of Societies of Anaesthesiologists","Education","Education + Science + Advocacy",3,18,"Yes","Covers anaesthesia and perioperative care for ACAN.","I3: Safer Anaesthesia From Education (SAFE) and Global Surgical Metrics Programme pilots. E5: WFSA Fellowship Programme (including PATA), scholarships, Essential Pain Management, VAST simulation, TeamSafe CS and the Anaesthesiology Online Learning Community (30,000+ professionals). S4: Global Anaesthesia Workforce Map and surgical metrics toolkits. A5: WHO engagement, the Essential Emergency and Critical Care and Labour Analgesia declarations, World Anaesthesia Day and Closing the Capno Gap. Sv1: Nothing on patient recovery."],["ACAN",100,"World Stroke Organization","Advocacy","Implementation + Education + Science + Advocacy + Survivorship",5,22,"Yes","ACAN's only stroke-specific member and its strongest survivorship example.","I4: WSO Stroke Center Certification for hospitals and the Roadmap to Delivering Quality Stroke Care that goes with the Global Stroke Services Guideline and Action Plan. E4: World Stroke Academy and its webinar series. S4: International Journal of Stroke, World Stroke Congress (Rio de Janeiro 2027) and the Global Stroke Fact Sheet. A5: World Stroke Day (#ActFAST), World Stroke Campaign, Global Stroke Action Coalition and WSO policy statements. Sv5: Stroke support organisation (SSO) capacity strengthening, SSO Global Mapping, Stroke Connector, survivor stories and lay membership."]]},{"name":"Gap Analysis","kind":"table","headers":["Thematic Area","Observed Evidence","Gap Classification","Organisations Identified","Interpretation","Potential Implication for ACAN and GRA"],"rows":[["Survivorship","GRA average 2.58; 6 of 24 score 4 or 5; only Heartsight and WSO score 5. ACAN average 1.64; 6 members score 4 or more.","Present but fragmented","GRA: Heartsight, SCA Foundation, WSO, ERC, AHA, SCCM. ACAN adds ICRC (rehabilitation).","Survivor work exists but is small, volunteer-heavy and US-centred. ACAN adds little beyond what GRA already has.","GRA is better placed than ACAN to lead a survivorship workstream; ACAN could adopt whatever GRA defines."],["Cardiac arrest recovery","Survivor-facing cardiac arrest programs found only at Heartsight, SCA Foundation (CASA), AHA Support Network and ERC Patient and Family.","Few identified organizations","Heartsight; SCA Foundation; AHA; ERC.","No clinical recovery pathway (screening, rehabilitation referral, follow-up) is owned by anyone on either list.","Define a minimum post-arrest recovery standard, possibly through ILCOR's post-resuscitation work."],["Rehabilitation","GACI's vision names restoration of function; WSO covers stroke rehabilitation; ICRC runs physical rehabilitation (ACAN). No cardiac arrest rehabilitation body found.","Few identified organizations","GACI, WSO (GRA); ICRC, Interburns, Sunnybrook (ACAN).","Rehabilitation sits with stroke and trauma, not cardiac arrest.","Borrow from WSO and ICRC models rather than building from scratch."],["Patient and family engagement","Survivors and co-survivors are engaged by Heartsight, SCA Foundation, CCPRF's Summit and WSO's support organisations.","Present but concentrated","Heartsight, SCA Foundation, Citizen CPR Foundation, WSO (GRA); palliative care networks (ACAN).","Engagement is concentrated in the US and in stroke.","Add a patient or family seat to GRA regional alliances outside the US."],["Resuscitation consensus science","ILCOR CoSTR feeds AHA and ERC guidelines. ILCOR's 2023 statement says past recommendations were not inclusive of large parts of the world.","Present but concentrated","ILCOR, AHA, ERC (GRA); ILCOR, AHA (ACAN).","Science is strong but written mostly from high-resource settings.","Back ILCOR's low-resource work with AFEM, IFEM and EECC Global evidence."],["Community CPR","Many GRA bodies train lay rescuers or run CPR campaigns (IFRC, AHA, ERC, RAF, CCPRF, SCA Foundation).","Present but fragmented","IFRC, AHA, ERC, Resuscitation Academy, Citizen CPR Foundation, SCA Foundation (GRA); IFRC, AHA (ACAN).","Lots of activity, little shared measurement of bystander CPR rates.","Use one bystander CPR indicator across GRA regions."],["EMS systems","RAF, EMS Europe and AAEMS cover North America, Europe and Asia. Low-resource settings rely on AFEM, and on LFR International, which has been on the ACAN list only since November 2026.","Present but concentrated","RAF, EMS Europe, AAEMS, AFEM (GRA); LFR International, NAEMSP, NCCTRC (ACAN).","EMS expertise is concentrated in high-income systems.","Pair each GRA region with a low-resource EMS partner (AFEM on GRA; LFR International from ACAN)."],["Registries and measurement","EuReCa (ERC), PAROS and PATOS (AAEMS), AHA programs, ACS registries. ACAN adds ANZICS CORE and NICS-MORU ICU registries.","Present but fragmented","ERC, AAEMS, AHA, ACS (GRA); ANZICS, NICS-MORU, Khon Kaen WHO CC (ACAN).","Strong registries that do not share a common core data set.","A shared Utstein core set is the single most useful GRA-ACAN joint project."],["Implementation science","EECC Global publishes implementation evidence, and so does LFR International (now ACAN only). Laerdal Foundation funds Safer Births. No published evaluation of the GRA Ten Programs was found in the September 2026 pass.","Few identified organizations","EECC Global, Laerdal Foundation, ILCOR EIT task force (GRA); LFR International (ACAN).","The GRA model spreads by case study rather than formal evaluation.","Fund a multi-region evaluation of the Ten Programs."],["Policy and financing","GSA won the 2017 WHA sepsis resolution; GACI and EWENE work with ministries. ACAN adds Harvard PGSSC, LSE and WFSA on surgery policy.","Few identified organizations","GSA, GACI, EWENE (GRA); PGSSC, LSE Global Surgery Policy Unit, WFSA (ACAN).","Nobody on the GRA list works on financing resuscitation services.","ACAN's surgery policy experience could inform a GRA financing ask."],["Trauma systems","ACS and GACI on GRA. ACAN is much richer: AAST, AO Alliance, IATSIC, Primary Trauma Care Foundation, STN, ESTES, Panamerican Trauma Society and LFR International.","Present but concentrated","ACS, GACI (GRA); ACAN trauma societies listed, plus LFR International.","ACAN covers what GRA only touches.","Decide whether trauma arrest sits in GRA scope; if yes, draw partners from ACAN."],["Maternal and newborn care","EWENE, ICM, AAP and Laerdal Foundation; GRA newborn alliance since 2024.","Present but fragmented","EWENE, ICM, AAP, Laerdal Foundation (GRA); ICM, AAP (ACAN).","Right players present, but newborn resuscitation targets are not tied to EWENE country plans.","Link the GRA newborn alliance to EWENE country acceleration plans."],["Critical care quality","SCCM, EECC Global and GSA on GRA. ACAN adds ANZICS, NICS-MORU, WFICC, WFPICCS, WFCCN, Charité, The George Institute.","Present but concentrated","SCCM, EECC Global, GSA (GRA); ACAN critical care bodies listed.","ACAN is stronger than GRA here.","Use ACAN critical care members for GRA in-hospital cardiac arrest work."],["Regional gaps","GRA has no Latin American or Middle Eastern organisation; Africa relies on AFEM; Asia on AAEMS and a low-activity ASEM. LFR International, the other African field partner, is now on ACAN only.","No identified organization","None for Latin America or Middle East on GRA. ACAN adds FLAME and Panamerican Trauma Society.","The GRA's regional pages (North America, Europe, Asia, Australia/NZ) match this gap.","ACAN members are the obvious bridge into Latin America."],["Humanitarian delivery","IFRC is the only humanitarian body on GRA. ACAN adds ICRC, MSF and Malteser International.","Few identified organizations","IFRC (GRA); ICRC, MSF, Malteser International, NCCTRC (ACAN).","Conflict and crisis settings are almost absent from GRA.","Invite ICRC or MSF to advise on resuscitation in crisis settings."],["Public awareness campaign overlap","World Restart a Heart (ILCOR, ERC, EUSEM), Get Trained Save Lives (ERC), World First Aid Day (IFRC), World Sepsis Day (GSA), World Stroke Day (WSO), SCA Foundation campaigns.","Overrepresented","ILCOR, ERC, EUSEM, IFRC, GSA, WSO, SCA Foundation, AHA (GRA).","Many separate days and campaigns, no shared calendar or message.","A joint calendar and shared core message would cost little."]]},{"name":"Group Review - Conflicts","kind":"table","headers":["Organisation","Proposed Domain","Alternative Domain","Reason for Conflict","Evidence","Recommended Review Decision","Priority"],"rows":[["Global Resuscitation Alliance (GRA #1) / Global Resuscitation Alliance (ACAN #29)","Implementation","Education","Appears on both lists. Same organisation (the GRA itself).","Official site: https://www.globalresuscitationalliance.org. Scored separately on each tab from the same evidence, so scores rom the GRA list in November 2026 and kept on ACAN, as instructed.","Official site: https://lfrinternational.org. Scored separately on each tab from the same evidence, so scores match.","Resolved: keep the ACAN row only. No GRA row remains to reconcile.","Closed"],["Society of Critical Care Medicine (GRA #8) / Society for Critical Care Medicine (ACAN #73)","Education","Implementation","Appears on both lists. Same organisation. The ACAN spelling ('for') is not the official name.","Official site: https://sccm.org. Scored separately on each tab from the same evidence, so scores match.","Keep both rows as the list requires; count once in network totals; name one contact owner. Correct the ACAN spelling to the official name.","High"],["World Stroke Organization (GRA #9) / World Stroke Organization (ACAN #100)","Advocacy","Survivorship","Appears on both lists. Same organisation.","Official site: https://www.world-stroke.org. Scored separately on each tab from the same evidence, so scores match.","Keep both rows as the list requires; count once in network totals; name one contact owner.","Medium"],["International Federation of Red Cross (GRA #16) vs International Committee of the Red Cross (ACAN #44)","Education","Implementation","Similar names; easy to merge by mistake.","IFRC is the federation of National Societies; ICRC is a separate Movement body focused on armed conflict.","Treat as two organisations. Do not merge.","Medium"],["European Council of Disaster Medicine (ACAN #22) vs WADEM (ACAN #93)","Advocacy","Education","ECDM president chairs the WADEM European Chapter; ECDM formed after a WADEM congress.","WADEM Europe Chapter page; ASPHER 2024 release.","Keep separate; note the shared leadership.","Low"],["Ethiopian Society of Emergency and Critical Care Professionals (ACAN #20)","Education","Advocacy","AFEM lists an 'Ethiopian Society for Emergency Professionals (ESEP)'; may be the same or a different body.","AFEM Who We Are member list.","Ask the ACAN secretariat which body is meant.","Low"],["American Heart Association (GRA #4)","Education","Science","All five scores are 4 or 5; Education and Science tie at 5.","22 million trained a year vs $6B+ research and guidelines.","Keep Education as primary for GRA purposes (CPR training reach); revisit if the group weights guidelines higher.","Medium"],["American Academy of Pediatrics (GRA #18)","Education","Advocacy","Education and Advocacy both score 5.","NRP and HBB vs child health advocacy.","Keep Education (NRP is its resuscitation asset).","Low"],["Global Resuscitation Alliance (GRA #1)","Implementation","Education","Implementation 5, Education 4; the RA model is training-led.","Mission names community implementation.","Keep Implementation.","Medium"],["Global Alliance for Care of the Injured (GRA #6)","Advocacy","Implementation","Could be read as a guidance (Implementation) body or an advocacy network.","WHO page; IFEM 2023 meeting report.","Keep Advocacy until WHO confirms current activity.","Low"],["Every Woman Every Newborn Everywhere (GRA #7)","Implementation","Advocacy","UN initiative that both supports country plans and campaigns globally.","WHO DG April 2025; Kenya plan.","Keep Implementation.","Low"],["Citizen CPR Foundation (GRA #5)","Education","Advocacy","Summit is education; mission is citizen action.","ECCU/Summit history; HEARTSafe.","Keep Education.","Low"],["EMS Europe (GRA #11)","Education","Implementation","Tie at 3; congress is education, board members run EMS systems.","2024 and 2026 press releases.","Keep Education; low confidence.","Low"],["Sudden Cardiac Arrest Foundation (GRA #14)","Advocacy","Survivorship","Awareness mission, but CASA is a major survivor program.","sca-aware.org About page.","Keep Advocacy; flag as a survivorship partner.","Low"],["Society of Critical Care Medicine (GRA #8)","Education","Implementation","Survivorship score of 4 rests on THRIVE, not opened in this pass.","THRIVE post-ICU collaboratives confirmed online on 6 Nov 2026 (published study pages).","Confirm THRIVE status before finalising Survivorship.","Medium"],["GRA founding date (GRA #1)","n/a","n/a","2015 (Utstein Abbey, per RA and Laerdal Foundation sites) vs 2016 (Copenhagen agreement, per JEMS).","See Sources tab.","Working group to pick one date and footnote the other.","High"],["Founding dates: AAEMS (2009 vs 2015), AFEM (2008 vs 2009), SCA Foundation (2005 vs 2007), ECDM (2013 vs 2014), ICM office move (1999 vs 2000)","n/a","n/a","Sources disagree; both values recorded in each row.","See Conflict / Uncertainty Notes in each row.","Confirm with each organisation.","Low"],["World Stroke Organization (GRA #9 / ACAN #100)","n/a","n/a","Mission and vision wording differs between the website, the Strategy 2023-2026 PDF and the homepage metadata.","world-stroke.org pages checked 6 Nov 2026; see Mission and Vision Research Notes.","Ask WSO which wording is current; until then use the website page wording recorded.","Medium"],["Every Woman Every Newborn Everywhere (GRA #7)","n/a","n/a","ewene.org could not be confirmed as official from WHO, UNICEF or UNFPA pages.","Website Verification Evidence column; status Needs Review.","Confirm the official site with the EWENE secretariat.","Medium"],["American College of Surgeons (GRA #15)","n/a","n/a","facs.org carries a notice limiting use of its content by AI tools without permission.","Notice seen on facs.org, Nov 2026.","Confirm permission before sharing the quoted statements outside the group.","Medium"],["Heartsight (GRA #13)","n/a","n/a","Run by Resuscitation Council US; latest visible date on the site is 2023.","ourheartsight.com footer and About page.","Confirm the initiative is active and who the contact is.","Low"],["ACAN list names that differ from official names","n/a","n/a","Society for (official: of) Critical Care Medicine (#73); International Federation of Medical Students' Organisations (official: Associations, #48); International Society for (official: of) Nurses in Cancer Care (#54); International Centre for Community-Driven Research now 'Centre for Communi-Driven Response' (#41); Primary Trauma Care Foundation now 'Life+Limb Primary Trauma Care' (#69); Alfred Health appears merged into Bayside Health (#4).","Official websites checked Nov 2026; see Outstanding Research Issue column.","Decide whether to keep the ACAN list names or adopt the official names. Names were not changed.","Low"],["Identity not settled (ACAN #26, #31)","n/a","n/a","Two different bodies use 'Global Emergency Care Collaborative'; the supplied site for 'Global Surgery Alliance, Inc.' is the Global Surgery Student Alliance.","Website Verification Evidence column; status Needs Review.","Ask the ACAN secretariat which bodies are meant. November scores describe the bodies at the supplied websites (UK GECCo; Global Surgery Student Alliance).","Medium"],["Corporación Latinoamericana para la Salud (ACAN #18)","n/a","n/a","Still unscored: its site blocks reading and no program, report or news about it was found online.","Web searches, 6 Nov 2026.","Ask the ACAN secretariat for a contact or document describing its work.","Medium"],["WHO Collaborating Centres not confirmed (ACAN #81, #87, #89)","n/a","n/a","Designation not confirmed in the WHO CC database for Colorado (#81), Khon Kaen (#87) or George Institute India (#89).","University and hospital pages; WHO Thailand Facebook post for #87.","Check the WHO CC database by hand.","Low"],["Websites that could not be read (ACAN #2, #18, #25, #80, #87)","n/a","n/a","Sites blocked or returned no readable content, so Mission and Vision say 'Unable to verify'.","Website Verification Evidence column.","Open each site in a browser and copy any published statements.","Medium"]]},{"name":"Quality Control","kind":"qc","title":"Quality Control","note":"Counts are live formulas. 'Expected' shows what the brief requires; 'Result' says Pass or Check.","checks":{"headers":["Check","GRA","ACAN","Total","Expected","Result"],"rows":[["Organisation entries on the tab",24,100,124,"24 / 100 / 124","Pass"],["Unique Organisation IDs",24,100,124,"124","Pass"],["Duplicate organisation names within a tab",0,0,0,"0","Pass"],["First five GRA rows in the required order",null,null,null,"GRA-01 to GRA-05","Pass"],["European Council of Disaster Medicine: removed from GRA, kept on ACAN",0,1,null,"0 on GRA, 1 on ACAN","Pass"],["Lay First Responders International: removed from GRA, kept on ACAN",0,1,null,"0 on GRA, 1 on ACAN","Pass"],["Rows fully scored (all five domains)",24,99,123,"Info",null],["Website status: Verified",23,93,116,"Info",null],["Website status: Needs Review",1,6,7,"Info",null],["Website status: Unavailable",0,1,1,"Info",null],["Website status recorded for every row",24,100,124,"124","Pass"],["Official Website given as a link",24,100,124,"124","Pass"],["Mission published (incl. excerpt)",18,69,87,"Info",null],["Mission not publicly available",6,26,32,"Info",null],["Mission unable to verify",0,5,5,"Info",null],["Mission published but no source URL",0,0,0,"0","Pass"],["Vision published (incl. excerpt)",15,45,60,"Info",null],["Vision not publicly available",9,50,59,"Info",null],["Vision unable to verify",0,5,5,"Info",null],["Vision published but no source URL",0,0,0,"0","Pass"],["Mission and Vision held in separate columns",1,1,2,"2 (one per tab)","Pass"],["Date Last Verified present",24,100,124,"124","Pass"],["Entries with an outstanding research issue",5,19,24,"Info",null],["Research log rows match the master tabs",24,100,124,"24 / 100 / 124","Pass"],["Rows flagged for classification review",11,48,59,"Info",null],["Research confidence High",23,71,94,"Info",null],["Research confidence Low",0,8,8,"Info",null],["Rows with at least one 'Unable to verify' cell",14,90,104,"Info",null]]},"method_title":"How the research and scoring worked","method":["November 2026 update. The GRA list was revised to 24 organisations: European Council of Disaster Medicine and Lay First Responders International were removed from GRA and kept on ACAN, and the five priority organisations were moved to the top. Every one of the 124 entries was then researched again in nine rounds of 15 (the last round had 4). For each entry the supplied URL from the Organisation Website Reference List was opened, the site's name and identity were checked, and the site was cross-checked against a second source such as a registry, WHO page or partner site. A supplied URL was only replaced when there was clear evidence, and every change is noted. Mission and Vision were looked for separately on the official site, quoted word for word, and given their own source URL. Where a site had no such statement the cell says 'Not publicly available on the official website.' Where a site could not be read the cell says 'Unable to verify'. Objectives, values, strategy text and general descriptions were not recorded as Mission or Vision; the original heading is noted in the research notes. Then all five domain scores were checked online for every entry: each organisation's official site (or, where the site could not be read, outside sources such as journals, registries and partner pages) was searched for named programs, courses, research, campaigns and survivor or recovery work. A score was changed only where the evidence called for it, and each change is explained in the Score Change Note column of the Research and Verification Log. Nine ACAN rows left unscored in September were researched and scored; one (Corporación Latinoamericana para la Salud) stays unscored because nothing could be found online.","September 2026 method (kept for the record). GRA rows were researched live on 25 September 2026. For each organisation I searched for the official site, took mission and vision wording only where it appeared on that site or an official document, and cross-checked founding year and legal status against a second source (a registry, a peer-reviewed history, WHO, or a partner institution). Where sources disagreed, both values are in t
