<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRA and ACAN Master Mapping</title>
<style>
:root{
  color-scheme: light;
  --red:#E00000; --ink:#000; --text:#333; --muted:#5F6466; --paper:#fff; --panel:#F3F5F5; --panel2:#E9EDED; --line:#D9DEDE; --line2:#C3CACA;
  --link:#1B5E20; --ok:#1B5E20; --ok-bg:#E3F1E4; --rev:#8F4700; --rev-bg:#FDEBD3; --una:#8E1B1B; --una-bg:#F9DCDC; --np:#5F6466; --np-bg:#ECEEEE;
  --d1:#2a78d6; --d2:#eb6834; --d3:#1baf7a; --d4:#eda100; --d5:#e87ba4;
  --gra:#6250d6; --acan:#008300;
  --h1:#cde2fb; --h2:#86b6ef; --h3:#3987e5; --h4:#1c5cab; --h5:#0d366b; --h1t:#0d366b; --h2t:#0d366b; --h3t:#fff; --h4t:#fff; --h5t:#fff;
  --grid:#E4E8E8; --shadow:0 8px 24px rgba(0,0,0,.14);
  --rail:236px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#f0efec; --text:#d6d5d0; --muted:#a9a8a2; --paper:#1a1a19; --panel:#242423; --panel2:#2d2d2b; --line:#3a3a38; --line2:#4a4a47;
    --link:#7fc77f; --ok:#8fd18f; --ok-bg:#1f3320; --rev:#f2b766; --rev-bg:#3a2a12; --una:#f19b9b; --una-bg:#3b1d1d; --np:#a9a8a2; --np-bg:#2d2d2b;
    --d1:#3987e5; --d2:#d95926; --d3:#199e70; --d4:#c98500; --d5:#d55181;
    --gra:#9085e9; --acan:#008300;
    --h1:#184f95; --h2:#1c5cab; --h3:#3987e5; --h4:#86b6ef; --h5:#cde2fb; --h1t:#fff; --h2t:#fff; --h3t:#fff; --h4t:#0d366b; --h5t:#0d366b;
    --grid:#30302e; --shadow:0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:14px/1.5 Arial,Tahoma,Helvetica,sans-serif}
a{color:var(--link)}
a:hover{color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3,h4{color:var(--ink);margin:0;font-family:Arial,Tahoma,sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);min-width:0}
.brand .logo{height:40px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 4px}
.brand span{font-weight:bold;font-size:15px;line-height:1.2;border-left:1px solid var(--line);padding-left:14px}
.gsearch{margin-left:auto;position:relative;width:min(420px,38vw)}
.gsearch input{width:100%;padding:8px 12px;border:1px solid var(--line2);border-radius:4px;background:var(--paper)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;display:none;z-index:40}
.gres.open{display:block}
.gres button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--text)}
.gres button:hover,.gres button.act{background:var(--panel)}
.gres small{color:var(--muted);display:block}

.frame{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:calc(100vh - 61px)}
nav.rail{border-right:1px solid var(--line);padding:14px 10px 30px;background:var(--paper);position:sticky;top:61px;align-self:start;max-height:calc(100vh - 61px);overflow:auto}
nav.rail .grp{font-size:12px;color:var(--muted);margin:16px 12px 4px}
nav.rail .grp:first-child{margin-top:2px}
nav.rail a{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:7px 12px;border-radius:4px;color:var(--text);text-decoration:none;margin-bottom:1px}
nav.rail a b{font-weight:normal;color:var(--muted);font-size:12px}
nav.rail a:hover{background:var(--panel)}
nav.rail a[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:bold;box-shadow:inset 3px 0 0 var(--red)}
nav.rail .note{margin:22px 12px 0;font-size:12px;color:var(--muted)}
main{padding:24px 32px 70px;min-width:0}
.view h1{font-size:26px;line-height:1.2}
.sub{margin:6px 0 0;color:var(--muted);max-width:90ch}
section.blk{margin-top:30px}
section.blk>h2{font-size:18px;margin-bottom:6px}
section.blk>p.desc{margin:0 0 12px;color:var(--muted);max-width:90ch}

/* overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:end;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hero .num{font-size:88px;line-height:.85;font-weight:bold;color:var(--ink);letter-spacing:-2px}
.hero h1{font-size:24px}
.hero p{margin:6px 0 0;max-width:72ch}
.tiles{display:flex;flex-wrap:wrap;margin-top:18px;max-width:1200px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tile{flex:1 1 150px;background:var(--paper);padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile .v{font-size:28px;font-weight:bold;color:var(--ink);line-height:1.1}
.tile .l{font-size:13px;color:var(--text)}
.tile .s{font-size:12px;color:var(--muted)}
.statusline{margin:16px 0 0;padding:11px 15px;background:var(--ok-bg);color:var(--ok);border-radius:4px;max-width:1200px}
dl.find{margin:0;display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;max-width:1200px;border-top:1px solid var(--line)}
dl.find dt,dl.find dd{padding:10px 0;border-bottom:1px solid var(--line);margin:0}
dl.find dt{font-weight:bold;color:var(--ink);padding-right:16px}

/* simple tables */
.stw{overflow-x:auto;max-width:1200px}
table.st{border-collapse:collapse;width:100%}
table.st th,table.st td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
table.st th{font-size:12px;color:var(--muted);font-weight:bold;background:var(--panel)}
table.st td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;font-weight:bold;white-space:nowrap}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-rev{background:var(--rev-bg);color:var(--rev)}
.s-una{background:var(--una-bg);color:var(--una)}
.s-np{background:var(--np-bg);color:var(--np)}
.a-pub{color:var(--ok);font-weight:bold}.a-ex{color:var(--rev);font-weight:bold}.a-np{color:var(--np)}.a-uv{color:var(--rev);font-weight:bold}

/* data table */
.dt-tools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:14px 0 8px}
.dt-tools label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.dt-tools input[type=search],.dt-tools select{padding:7px 9px;border:1px solid var(--line2);border-radius:4px;background:var(--paper);max-width:230px}
.dt-tools input[type=search]{width:250px;max-width:100%}
.dt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 8px}
.dt-count{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--panel)}
.btn.on{background:var(--ink);color:var(--paper)}
.linkbtn{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:0;text-align:left}
.dt-wrap{overflow:auto;border:1px solid var(--line);border-radius:4px;max-height:72vh;background:var(--paper)}
table.dt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.dt th,table.dt td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left;background:var(--paper)}
table.dt thead th{position:sticky;top:0;z-index:3;background:var(--panel);color:var(--ink);font-size:12px;cursor:pointer;user-select:none;white-space:normal;min-width:90px}
table.dt thead th:hover{background:var(--panel2)}
table.dt thead th .ar{color:var(--muted);font-weight:normal;margin-left:4px}
table.dt td.sticky,table.dt th.sticky{position:sticky;z-index:2}
table.dt thead th.sticky{z-index:4}
table.dt tbody tr:hover td{background:var(--panel)}
table.dt tbody tr.click{cursor:pointer}
.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
td.open .cl{display:block;-webkit-line-clamp:unset}
td.w-l{min-width:260px;max-width:420px}
td.w-m{min-width:150px;max-width:260px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{display:inline-block;min-width:26px;text-align:center;border-radius:3px;font-weight:bold;padding:1px 6px}
.sc1{background:var(--h1);color:var(--h1t)}.sc2{background:var(--h2);color:var(--h2t)}.sc3{background:var(--h3);color:var(--h3t)}.sc4{background:var(--h4);color:var(--h4t)}.sc5{background:var(--h5);color:var(--h5t)}
.colmenu{position:relative;display:inline-block}
.colmenu .pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:10px;z-index:20;width:320px;max-height:60vh;overflow:auto;display:none}
.colmenu.open .pop{display:block}
.colmenu .pop label{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13px}
.colmenu .pre{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}

/* charts */
.chart{max-width:1100px;margin:6px 0 4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .lb{fill:var(--text);font-size:12px}
.chart .val{fill:var(--ink);font-size:11px;font-weight:bold}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--text);margin:8px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.dot{border-radius:50%}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--paper);color:var(--text);border:1px solid var(--line2);border-radius:4px;box-shadow:var(--shadow);padding:7px 10px;font-size:12px;max-width:320px;display:none}
.tip b{color:var(--ink)}
.mult{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;max-width:1100px}
.mult h4{font-size:13px;margin-bottom:4px}
details.data{margin-top:8px;max-width:1100px}
details.data summary{cursor:pointer;color:var(--link);font-size:13px}

/* heat map */
.heat{overflow:auto;max-width:1100px}
table.hm{border-collapse:separate;border-spacing:2px;font-size:12px}
table.hm th{font-weight:bold;color:var(--muted);text-align:left;padding:2px 6px;white-space:nowrap}
table.hm th.c{text-align:center;width:92px}
table.hm td.o{padding:2px 8px 2px 0;color:var(--text);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.hm td.h{width:92px;height:26px;text-align:center;font-weight:bold;border-radius:3px;cursor:default}
table.hm td.h.e{background:var(--panel);color:var(--muted);font-weight:normal}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:8px 0}
.hleg span{display:flex;align-items:center;gap:6px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45;display:none}
.scrim.on{display:block}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--paper);z-index:50;overflow:auto;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
aside.drawer.on{transform:none;visibility:visible;box-shadow:-6px 0 24px rgba(0,0,0,.2);transition:transform .22s ease}
.d-head{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:2}
.d-body{padding:18px 22px 50px}
.d-body h2{font-size:22px;line-height:1.25}
.d-meta{color:var(--muted);margin:6px 0 0}
.d-grp{margin-top:22px}
.d-grp>h3{font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:4px}
dl.kv{margin:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
dl.kv dt,dl.kv dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}
dl.kv dt{color:var(--muted);font-size:12px;padding-right:12px}
dl.kv dd{font-size:14px;word-break:break-word}
.stmt{border-left:4px solid var(--red);padding-left:12px;color:var(--ink);font-size:15px}
.stmt.none{border-left-color:var(--line2);color:var(--muted)}
.sbars{display:grid;grid-template-columns:120px 1fr 30px;gap:6px 10px;align-items:center;margin:8px 0}
.sbars .tr{height:12px;background:var(--panel);border-radius:2px;overflow:hidden}
.sbars .fl{height:100%;border-radius:0 3px 3px 0}
.printhead{display:none}

footer.foot{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:1100px}

@media (max-width:900px){
  .top{flex-wrap:wrap;padding:10px 14px}
  .gsearch{width:100%;margin-left:0}
  .frame{grid-template-columns:1fr}
  nav.rail{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px}
  nav.rail .grp,nav.rail .note{display:none}
  nav.rail a{white-space:nowrap;margin:0}
  nav.rail a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--red)}
  main{padding:18px 14px 50px}
  .hero{grid-template-columns:1fr}.hero .num{font-size:64px}
  dl.find,dl.kv{grid-template-columns:1fr}
  dl.find dt,dl.kv dt{border-bottom:0;padding-bottom:0}
  table.dt td.sticky,table.dt th.sticky{position:static}
}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
@media print{
  .top,nav.rail,.dt-tools,.dt-bar .acts,.scrim,.d-head .acts,.gsearch,details.data summary,.colmenu{display:none!important}
  details.data{display:block}
  .frame{display:block;min-height:0}
  main{padding:0}
  body{font-size:11px}
  .dt-wrap{max-height:none;overflow:visible;border:0}
  table.dt{font-size:9px}
  table.dt thead th{position:static}
  table.dt td.sticky,table.dt th.sticky{position:static}
  .cl{display:block;-webkit-line-clamp:unset}
  .printhead{display:flex!important;align-items:center;gap:12px;border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:10px;font-size:11px}
  .printhead img{height:32px}
  body.pp main{display:none}
  body.pp .frame{display:none}
  body.pp aside.drawer{position:static;transform:none;visibility:visible;width:auto;overflow:visible;box-shadow:none}
  body:not(.pp) aside.drawer{display:none}
  section.blk,.chart,.d-grp{break-inside:avoid}
}
</style>
</head>

<script type="application/json" id="data">{"meta":{"title":"GRA and ACAN Master Organisation Mapping","verified":"6 Nov 2026","source":"GRA and ACAN Master Mapping workbook (Excel), 6 November 2026"},"sheets":[{"name":"Overview","kind":"overview","title":"GRA and ACAN Master Organisation Mapping","intro":["Maps the 24 GRA and 100 ACAN organisations (124 entries) against the Formula for Survival: Implementation x Education x Science = Survivorship, with Advocacy alongside.","Generated: 25 September 2026. Updated: 6 November 2026 (GRA list revised to 24; websites, Mission and Vision checked for all 124 entries)."],"dash_note":"Live counts from the two master tabs and the Research and Verification Log. An organisation on both lists counts once on each list.","dashboard":{"headers":["Measure","What it counts","GRA","ACAN","Total"],"rows":[["Organisation entries","Rows on each master tab.",24,100,124],["Unique organisations","Entries on both lists counted once (16 organisations sit on both).",null,null,108],["Entries researched","Rows with a Date Last Verified (nine rounds of 15).",24,100,124],["Official websites verified","Identity and official status confirmed.",23,93,116],["Websites needing review","Incomplete, conflicting or thin evidence.",1,6,7],["Websites unavailable","Site could not be opened or established.",0,1,1],["Mission published","Statement found and quoted (includes excerpt-only).",18,69,87],["Mission not publicly available","Site read; no mission statement found.",6,26,32],["Mission unable to verify","Site could not be read.",0,5,5],["Vision published","Statement found and quoted (includes excerpt-only).",15,45,60],["Vision not publicly available","Site read; no vision statement found.",9,50,59],["Vision unable to verify","Site could not be read.",0,5,5],["Entries with outstanding research issues","See Outstanding Research Issue on each tab and in the log.",5,19,24],["Rows not yet scored","9 ACAN rows were unscored in September 2026; 8 were researched and scored in November. Corporación Latinoamericana para la Salud stays unscored because nothing about its work could be found online.",0,1,1]]},"status":["Overall research status","Complete: all 124 entries researched and verified on 6 Nov 2026. 24 entries carry an open item for the working group."],"findings_title":"Headline findings","findings":[["GRA: strong domains","Education and Advocacy are the GRA list's strongest domains: 15 of 24 organisations score 4 or 5 in Education and 15 in Advocacy. Most of that weight sits with the big guideline and training bodies (AHA, ERC, IFRC, AAP) and the awareness groups (SCA Foundation, GSA, WSO)."],["GRA: thin domain","Survivorship is the clear gap. It averages 2.58 on the GRA list, only 6 of 24 score 4 or 5, and just two (Heartsight and WSO) treat it as core. The GRA's own 50 percent target counts survival, not recovery."],["GRA: bridges","13 of 24 GRA organisations score 4 or 5 in three or more domains. AHA (24 of 25), WSO (22) and ERC (22) are the broadest. EMS Europe (11), ASEM (11) and Heartsight (13) are the narrowest; for congress networks and a survivor resource that is expected."],["GRA: fragmentation","Cardiac arrest registries sit in separate regional hands (ERC's EuReCa in Europe, AAEMS's PAROS in Asia, AHA programs in the US) with no shared data set found. Survivor support is split between three small US groups and two large councils."],["GRA: governance","The GRA's founding year is recorded as both 2015 (Utstein Abbey) and 2016 (Copenhagen agreement), and no legal status is published. The Laerdal Foundation funds the GRA and also seed-funded WHO's Acute Care Action Network, which is worth disclosing in both networks."],["ACAN: shape","Education is the lead domain for 54 of the 99 scored ACAN organisations. Implementation averages 3.00 and Survivorship 1.64, with only 6 ACAN members (AHA, ANZICS, ICRC, Operation Smile, SCCM and WSO) scoring 4 or more on Survivorship."],["ACAN: covers GRA gaps","ACAN adds what GRA lacks in trauma systems (AAST, AO Alliance, IATSIC, Primary Trauma Care Foundation), humanitarian delivery (ICRC, MSF, Malteser) and critical care registries (ANZICS, NICS-MORU)."],["Overlap and data quality","16 organisations sit on both lists, two under different names (EMS Europe / European Association of EMS; Society of / for Critical Care Medicine). European Council of Disaster Medicine and Lay First Responders International left the GRA list in November 2026 and stay on ACAN. 9 ACAN rows were unscored in September 2026; 8 were researched and scored in November. Corporación Latinoamericana para la Salud stays unscored because nothing about its work could be found online. All scores were checked online in November 2026; descriptive fields marked '(background)' on ACAN rows were not."]],"burden_title":"Annual burden of the five time-critical conditions (rough global figures)","burden":{"headers":["Condition","Rough annual figure","Where the figure came from","Notes"],"rows":[["Cardiac arrest","About 1 million deaths a year from sudden cardiac arrest in the most highly developed countries alone; more than 350,000 out-of-hospital cardiac arrests a year in the US.","GRA launch coverage, JEMS 2016 (jems.com); Resuscitation Academy Foundation release, JEMS 2024.","No single sourced global figure was found in this pass. Treat as a floor, not a global total."],["Trauma and injury","Over 5 million deaths a year from road crashes, violence and other injuries; injury is about 11% of the global burden of disease, with about 90% in low- and middle-income countries.","WHO Global Alliance for Care of the Injured page (who.int).","WHO also reports six times higher mortality for survivable injuries in low-income settings (36% vs 6%)."],["Sepsis","About 11 million deaths and 47 to 50 million cases a year.","BC Children's Hospital Research Institute, World Sepsis Day 2020 (bcchr.ca), citing GSA and WHO figures.","Secondary source quoting the widely used 2020 global estimate; primary study not opened in this pass."],["Stroke","About 12.2 million new strokes and 6.6 million deaths a year; about 100 million people living after stroke.","WSO Strategy 2023-2026 summary (world-stroke.org).","Official WSO document."],["Maternal and newborn emergencies","Hundreds of thousands of maternal deaths and millions of newborn deaths a year; about 1 million newborn deaths a year from birth asphyxia (older WHO estimate).","WHO Director-General remarks, 7 April 2025 (who.int); AAP Helping Babies Breathe project page citing WHO (globalgiving.org).","The asphyxia figure is an older WHO estimate quoted by AAP; use for scale only."]]},"domains_title":"Formula for Survival: domains in fixed order","domains":{"headers":["Domain","Lead domain for (GRA / ACAN / total)","Main strength","Main gap"],"rows":[["Implementation","GRA: 4   ACAN: 13   Total: 17","Large-scale delivery: IFRC National Societies, AHA hospital programs, Resuscitation Academy Lighthouses, and on ACAN, LFR International's 7,900 lay responders.","Few GRA implementers work outside North America and Europe; Africa and Asia depend on AFEM and AAEMS, with LFR International (now ACAN only) the main lay-responder model."],["Education","GRA: 9   ACAN: 54   Total: 63","CPR and clinical training at very large scale: AHA about 22 million a year, IFRC 12 to 20 million (its 2022 figures differ by source), ERC 381,000 in 2025.","Training volume is counted; its effect on survival is rarely reported."],["Science","GRA: 4   ACAN: 19   Total: 23","ILCOR CoSTR, AHA and ERC guidelines, EuReCa and PAROS registries, Laerdal Foundation grants.","Registries are regional and unlinked; little published implementation science on the Ten Programs."],["Advocacy","GRA: 6   ACAN: 13   Total: 19","World Sepsis Day and the 2017 WHA sepsis resolution show what a coalition can win; strong public days for stroke, first aid and CPR.","No shared GRA campaign or resuscitation resolution found; many overlapping awareness days."],["Survivorship","GRA: 1   ACAN: 0   Total: 1","Heartsight, SCA Foundation's Cardiac Arrest Survivor Alliance, WSO's survivor organisations, ERC's Patient and Family initiative.","Weakest domain on both lists; no GRA body owns post-arrest recovery, rehabilitation or co-survivor support at scale."]]},"questions_title":"Questions for the working group (GRA first)","questions":{"headers":["#","Question","Finding it comes from"],"rows":[["Q1","Should the GRA add a survivor outcome (quality of life or return to function) next to its 50 percent survival target, and form a survivorship workstream with Heartsight, the SCA Foundation, WSO and ERC?","Survivorship averages 2.58 on GRA and 1.64 on ACAN; only Heartsight and WSO score 5."],["Q2","Can the GRA broker one core Utstein data set shared by EuReCa, PAROS and the US registries so regional results can be compared?","Registries are split across ERC, AAEMS and AHA with no shared data set found."],["Q3","Trauma, newborn and critical illness bodies (ACS, GACI, EWENE, ICM, AAP, EECC Global) make up about a quarter of the GRA list. Does the GRA formally widen scope beyond cardiac arrest, or keep them as partners only?","11 of 24 GRA rows are rated 'Significant adjacent' rather than 'Direct' for cardiac arrest relevance."],["Q4","How should the group record the GRA's founding date and legal home, and disclose the Laerdal Foundation's role as funder of both the GRA and WHO's Acute Care Action Network?","Founding date conflict (2015 vs 2016); no published legal status; dual funding role."],["Q5","Is a joint awareness calendar realistic, given World Restart a Heart, Get Trained Save Lives, World First Aid Day, World Sepsis Day and World Stroke Day all run separately?","Public awareness campaigns classed as Overrepresented in Gap Analysis."]]}},{"name":"GRA Master Mapping","kind":"master","headers":["Serial No.","Organisation ID","Organisation Name","Alternative / Former Names","Entity Type","GRA Serial Position","Relationship to GRA","Country / Headquarters","Geographic Scope","Year Started / Founded","Registered / Legal Status","Legal Status Evidence","Information About the Organisation","Operating Space","Principal Population Served","Primary Organisational Function","Resuscitation / Cardiac Arrest Relevance","Primary Domain","Secondary Domain","Implementation Score (1-5)","Education Score (1-5)","Science Score (1-5)","Advocacy Score (1-5)","Survivorship Score (1-5)","Breadth Score","Domains Active","Formula for Survival Role","Contribution Across Formula for Survival","Relevance to GRA","Relevance to ACAN","Overlaps with GRA Programs","Overlaps within ACAN","Key Programs, Assets and Resources","Mission","Vision","Mission Source URL","Vision Source URL","Mission Availability","Vision Availability","Mission and Vision Research Notes","Official Website","Website Verification Status","Website Verification Evidence","Supplied Website (Reference List)","Website Change Note","Date Last Verified","Outstanding Research Issue","Key Sources","Evidence for Classification","Research Confidence","Conflict / Uncertainty Notes","Classification Review Needed","Suggested Review Question"],"rows":[[1,"GRA-01","Global Resuscitation Alliance","GRA","Alliance",1,"Framework (the alliance itself; convenes the other 23)","Seattle, USA (secretariat role held by the Resuscitation Academy Foundation per 2016 AHA release). Registered office: Unable to verify.","Global (regional pages for North America, Europe, Asia, Australia/New Zealand)","2015 or 2016 (see conflict note)","Unable to verify","No registration or incorporation record found on globalresuscitationalliance.org. The 2016 AHA release says the Resuscitation Academy Foundation serves as its Secretariat.","The GRA is an international network of EMS and resuscitation leaders set up to raise cardiac arrest survival by 50 percent. It spreads the Resuscitation Academy model and ten best-practice programs through regional alliances and a measure-and-improve approach. With Laerdal Foundation support the idea has since moved into in-hospital, paediatric and newborn resuscitation.","Out-of-hospital cardiac arrest systems, EMS and dispatch, community response; now also in-hospital, paediatric and newborn resuscitation","EMS leaders, medical directors, dispatch centres and communities; ultimately people who have a cardiac arrest","Convening and implementation network","Direct. Its whole mission is to increase survival from cardiac arrest.","Implementation","Education",5,4,3,4,3,19,3,"Implementation leads here, with Education close behind through the Resuscitation Academy training model.","Implementation: Core. Education: Major. Science: Moderate. Advocacy: Major. Survivorship: Moderate.","This is the GRA itself. Every other row on this tab is read against its mission and its 50 percent survival target.","Appears on the ACAN list at #29. It brings a tested community implementation model that most ACAN members, who work on facility and system care, do not have.","Built on the Resuscitation Academy (GRA #2). Laerdal Foundation (#23) funds its expansions. AHA (#4) is a listed affiliate. Draws on ILCOR (#3) science and Utstein reporting.","Same entity as ACAN #29. Links to ACAN members through AHA (#7), ILCOR (#53), Laerdal Foundation (#58) and the Asian Association of EMS (#9).","Ten Programs for Improving Survival from Cardiac Arrest (with case studies); Utstein Formula of Survival; Ten Steps to Improve In-Facility Neonatal Resuscitation; regional alliances; In-hospital Pediatric Resuscitation Alliance (2022); newborn resuscitation GRA (2024); 10 steps for in-hospital cardiac arrest (2023).","The Mission of the Global Resuscitation Alliance is to advance resuscitation through the Resuscitation Academy model by accelerating community implementation of effective programs through a quality improvement strategy to measure and improve.","Not publicly available on the official website.","https://www.globalresuscitationalliance.org/mission/","Not applicable","Published","Not publicly available","Mission heading on source: 'Our Mission'. Vision: no statement found. Mission is under the heading 'Our Mission' on /mission/ and repeated on /about/. No Vision heading on homepage, /about/ or /mission/. /about/ lists affiliates (Resuscitation Academy, Laerdal Foundation, AHA, Utstein on Stroke) but no governance detail.","https://www.globalresuscitationalliance.org/","Verified","On the site: Homepage names Global Resuscitation Alliance; footer @2025; webinar dated 9 Apr 2025. Cross-check: Site names the GRA and carries its mission; search returns many globalresuscitationalliance.org pages; JEMS 2016 launch coverage names the GRA.","https://www.globalresuscitationalliance.org/","No change","6 Nov 2026",null,"GRA: Our Mission (https://www.globalresuscitationalliance.org/?p=7314); JEMS: New Global Alliance to Increase Survival after Sudden Cardiac Arrest by 50% (https://www.jems.com/patient-care/cardiac-resuscitation/new-global-alliance-to-increase-survival-after-sudden-cardiac-arrest-by-50/); Laerdal Foundation: Impact (https://laerdalfoundation.org/impact); Scoring check, 6 Nov 2026: https://www.globalresuscitationalliance.org/","I5: Ten Programs to Improve Survival with case studies, Ten Steps for in-facility neonatal resuscitation, and regional alliances in North America, Europe, Asia and Australia/New Zealand. E4: Resuscitation Academy affiliate and GRA webinar series (for example 'A Decade of Transforming Resuscitation Care', April 2025). S3: Utstein Formula of Survival, Utstein on Stroke and ILCOR's 10 Steps for in-hospital arrest; no primary research or registry of its own. A4: Call to Action with AHA, Laerdal and the Resuscitation Academy; public goal of a 50% rise in survival. Sv3: Survival rate is the stated, measured outcome; no recovery or survivor support program found.","High","Founding year conflict. JEMS (2016) says the founding agreement was signed at an Utstein meeting in Copenhagen on 28-29 May 2016, before EMS2016. The Resuscitation Academy site says the GRA was convened in 2015 at Utstein Abbey, Norway, and the Laerdal Foundation site also says 2015. Both recorded. Legal status not published.","Yes","Should the working group record 2015 (Utstein Abbey convening) or 2016 (Copenhagen agreement) as the founding year, and does the GRA have a legal home separate from the Resuscitation Academy Foundation?"],[2,"GRA-02","Resuscitation Academy Foundation","Resuscitation Academy; RA; RAF","Foundation",2,"Member (named GRA Secretariat in the 2016 AHA release)","Seattle, Washington, USA","US-based with international alumni","2008","Nonprofit foundation (US); IRS status not checked in this pass","Site describes 'A foundation committed to improving cardiac arrest survival rates' and takes donations. JEMS (2024) and the CARES 2022 report both date it to 2008.","The Resuscitation Academy grew out of Seattle and King County EMS and teaches other communities how to raise cardiac arrest survival. Its flagship leadership workshop walks EMS leaders through ten steps, from a registry to telephone CPR and high-performance CPR. It has trained about 5,600 EMS professionals from 2,000 agencies and gives its toolkits away free.","Out-of-hospital cardiac arrest; EMS and 911 systems","EMS managers, medical directors, dispatchers and community leaders","Training and implementation support","Direct. Its mission is to increase survival from sudden cardiac arrest.","Implementation","Education",5,5,2,3,2,17,2,"Implementation leads through Lighthouse communities and the ten steps, and Education is just as strong through the workshops.","Implementation: Core. Education: Core. Science: Minor. Advocacy: Moderate. Survivorship: Minor.","The GRA mission is built on the Resuscitation Academy model, so this is the engine room of the alliance.","Not on the ACAN list. Its model is what ACAN members would borrow for community cardiac arrest work.","Partners with AHA (#4) and Laerdal through RQI and the Resuscitation Academy Collaborative (2016). Member of the GRA (#1).","No direct ACAN member. Closest in focus are NAEMSP (#64) and the Asian Association of EMS (#9).","Leadership Workshop (ten steps); High-Performance CPR workshop and Train the Trainer; Cardiac Arrest System Self-Assessment (30 questions); RQI/RA programs; Lighthouse Communities; Community CPR Toolkit; Resuscitation Academy Mentorship Program (funded by Medic One Foundation).","The Resuscitation Academy's mission is to increase survival from sudden cardiac arrest.","Not publicly available on the official website.","https://www.resuscitationacademy.org/","Not applicable","Published","Not publicly available","Mission heading on source: 'Our Mission'. Vision: no statement found. Homepage 'Our Mission' section carries the one-line mission. /about-our-mission repeats it as 'Our mission is to increase survival from sudden cardiac arrest.' alongside a longer narrative headed 'Our Mission' ('When a heart stops, we're just getting started'). No Vision heading. Homepage tagline 'Working to create a world where everyone survives cardiac arrest' is not labelled as a vision, so it is not recorded as one.","https://www.resuscitationacademy.org/","Verified","On the site: Homepage names Resuscitation Academy; donations go to 'Resuscitation Academy Foundation'; footer © 2025. Cross-check: Site names the Resuscitation Academy (Foundation for donations); listed on the GRA affiliates page; same Squarespace site also answers at resuscitationacademy.squarespace.com; charity registers list Resuscitation Academy Foundation, EIN 81-2193189.","https://www.resuscitationacademy.org/","No change","6 Nov 2026",null,"Resuscitation Academy: Home (https://www.resuscitationacademy.org/); JEMS: Resuscitation Academy Foundation announces new medical director (2024) (https://www.jems.com/ems-management/resuscitation-academy-foundation-announces-new-medical-director/); JEMS: Two new resuscitation alliances (AHA release, 2016) (https://www.jems.com/patient-care/cardiac-resuscitation/two-new-resuscitation-alliances-announce-decisive-goal-to-increase-global-cardiac-arrest-survival-rates-by-50-percent/); Scoring check, 6 Nov 2026: https://www.resuscitationacademy.org/","I5: Lighthouse Communities, the 30-question Cardiac Arrest System Self-Assessment, consultative initiatives and RQI/RA programs with AHA and Laerdal. E5: Leadership, HP-CPR and HP-CPR Train the Trainer workshops, HP-CPR Toolkit, 'Ten Steps' eBook; RA Network of 3,000+ alumni (5,600 EMS professionals trained, JEMS 2024). S2: Materials are science-based but it names no research of its own. A3: Community CPR Toolkit for public awareness of bystander CPR; works with elected officials. Sv2: Mission is to raise survival, but no survivor or family support found.","High","Mission wording changed over time: older text on the GRA site says 'to improve survival from cardiac arrest'; the current RA site says 'to increase survival from sudden cardiac arrest'. Current wording used. The RA site dates the GRA to 2015 at Utstein Abbey (see GRA #1 conflict).","No","Does RAF still act as GRA Secretariat, and should that be recorded as a governance fact?"],[3,"GRA-03","International Liaison Committee on Resuscitation","ILCOR","Alliance",3,"Partner","Unable to verify a registered office. Meets twice a year, alternating US and non-US venues.","Global","1992","Unable to verify","ilcor.org About page describes a forum for liaison between resuscitation organisations. A 2013 peer-reviewed history says it was conceived in February 1992 in Dallas. No incorporation detail found.","ILCOR is where the world's resuscitation councils agree on the science. Its task forces review evidence and publish the Consensus on Science with Treatment Recommendations (CoSTR), which councils like AHA and ERC turn into their own guidelines. In 2023 it said past CPR recommendations had not been inclusive of large parts of the world and issued a statement on low-resource settings.","Resuscitation science: BLS, ALS, paediatric, neonatal, first aid, education and implementation","Resuscitation councils and guideline writers; indirectly all rescuers and patients","Evidence review and international consensus","Direct. Sets the global science base for CPR and emergency cardiovascular care.","Science","Education",2,3,5,3,3,16,1,"Science is the lead domain by a wide margin, with Education second through the Education, Implementation and Teams task force.","Implementation: Minor. Education: Moderate. Science: Core. Advocacy: Moderate. Survivorship: Moderate.","Supplies the 'medical science' factor in the Utstein Formula of Survival that the GRA uses. GRA programs sit downstream of CoSTR.","On the ACAN list at #53. The only pure resuscitation-science consensus body in either network.","Member councils include AHA (#4) and ERC (#10). Its 2023 low-resource statement was backed by AFEM (#17), EUSEM (#21) and IFRC (#16).","Same entity as ACAN #53. Also linked to IFEM (#47), which backed the 2023 statement, and AAP (#5) through neonatal guidelines.","Consensus on Science with Treatment Recommendations (CoSTR, 2005 onward, CoSTR 2025); task forces for BLS, ALS, Paediatric, Neonatal, Education Implementation and Teams, and First Aid; World Restart a Heart; Utstein reporting statements; 2023 statement on CPR in low-resource settings.","To promote, disseminate and advocate international implementation of evidence-informed resuscitation and first aid, using transparent evaluation and consensus summary of scientific data.","Saving more lives globally through resuscitation.","https://ilcor.org/about/mission-constitution","https://ilcor.org/about/mission-constitution","Published","Published","Mission heading on source: 'ILCOR Vision, Mission and Values (Mission)'. Vision heading on source: 'ILCOR Vision, Mission and Values (Vision)'. Mission continues 'We will fulfill this mandate by:' followed by eight activities (literature review; publishing consensus on science with treatment recommendations; collaborating on dissemination and training; mentorship; leading the research agenda and promoting funding; engaging patients, families and public; monitoring incidence and outcomes; evolving from international to global impact). Only the opening sentence is recorded as the Mission. Values list not recorded. Note: a homepage news blurb misnames the body 'International Advisory Committee on Resuscitation'.","https://www.ilcor.org/","Verified","On the site: Homepage names International Liaison Committee on Resuscitation; news dated 01.07.2026; event dated 28.09.2026. Cross-check: Site names ILCOR with 2026 news; ilcor.org/about returned by search; AAP and ERC partner pages refer to ILCOR.","https://www.ilcor.org/","No change","6 Nov 2026",null,"ILCOR: About (https://ilcor.org/about); ILCOR at 25 years (Resuscitation 2017, hosted on ilcor.org) (https://ilcor.org/uploads/ILCOR-at-25-years.pdf); Notfall + Rettungsmedizin (2013): ILCOR history (https://link.springer.com/article/10.1007/s10049-013-1739-1); SCA Foundation news: CPR in low-resource settings (2023) (https://sca-aware.org/index.php/sca-news/cardiopulmonary-resuscitation-in-low-resource-settings); Scoring check, 6 Nov 2026: https://www.ilcor.org/","I2: Hospital self-assessment against the '10 Steps to Improve In-Hospital Cardiac Arrest' (2026); does not run programs itself. E3: Education, Implementation and Teams task force; training guidance flows through member councils. S5: Consensus on Science with Treatment Recommendations (CoSTR 2024), 2024 OHCA Utstein template update, AI working group (2025). A3: World Restart a Heart and consensus media releases (low-resource CPR, 2023). Sv3: Scientific statement 'Improving Outcomes After Post-Cardiac Arrest Brain Injury' (2024) and post-resuscitation care reviews; no survivor-facing service.","High","Founding year 1992 agrees across ilcor.org and a peer-reviewed history. Legal form unable to verify. Member lists differ slightly between sources (some list the Australian and New Zealand councils separately).","No","Should the GRA ask ILCOR's Education, Implementation and Teams task force to co-own an implementation evidence review of the Ten Programs?"],[4,"GRA-04","American Heart Association","AHA; American Stroke Association is a division","Other (voluntary health organization)",4,"Partner (listed GRA affiliate; founding partner in 2016 announcement)","Dallas, Texas, USA (National Center, 7272 Greenville Ave.)","US-based with international programs","1924","501(c)(3) tax-exempt organization, Tax ID 13-5613797","Stated in the heart.org footer, which also links the Charity Navigator profile for EIN 135613797.","The AHA is the largest nonprofit, non-governmental funder of heart and stroke research in the US and trains about 22 million people in CPR each year. It writes resuscitation guidelines with its ILCOR partners and runs hospital quality programs. It was a founding partner of the GRA and backs the Resuscitation Academy Collaborative.","Cardiovascular and stroke care across prevention, acute care, resuscitation and recovery","The public, clinicians, hospitals and people living with heart disease and stroke","Research funder, guideline writer, trainer and advocate","Direct. Writes CPR and ECC guidelines and trains millions each year.","Education","Science",5,5,5,5,4,24,5,"Education leads on the scale of CPR training, with Science a very close second through guidelines and research funding; it scores high in every domain.","Implementation: Core. Education: Core. Science: Core. Advocacy: Core. Survivorship: Major.","Founding partner of the GRA and a listed affiliate. Its RQI program with Laerdal is one of the main routes for high-quality CPR training.","On ACAN at #7. Likely the biggest single contributor across all five domains in either network.","ILCOR member council (#3); Resuscitation Academy Collaborative with RAF (#2) and Laerdal; NRP co-developed with AAP (#18); founding partner of the Citizen CPR Foundation (#5).","Same entity as ACAN #7. Works with ILCOR (#53), AAP (#5) and the Laerdal Foundation (#58).","CPR and ECC guidelines and training (about 22 million people a year); Resuscitation Quality Improvement (RQI) with Laerdal; Get With The Guidelines hospital programs (background knowledge); high blood pressure quality initiative (19 million+ patients); AHA Support Network for survivors and caregivers; International Programs; more than $6 billion invested in research.","To be a relentless force for a world of longer, healthier lives.","Advancing health and hope for everyone, everywhere.","https://www.heart.org/en/-/media/Annual-Report/2024-2025-Annual-Report-Files/FY_2425-American-Heart-Association-Annual-Report.pdf?sc_lang=en","https://www.heart.org/en/-/media/Annual-Report/2024-2025-Annual-Report-Files/FY_2425-American-Heart-Association-Annual-Report.pdf?sc_lang=en","Published","Published","Mission heading on source: 'Introduced as 'our mission statement' (Annual Report 2024-25, 'About the American Heart Association')'. Vision heading on source: 'Introduced as 'the vision statement for our next 100 years' (Annual Report 2024-25)'. heart.org/en/about-us has no Mission or Vision heading; its closest line is the unlabelled 'We want to see a world free of cardiovascular diseases and stroke.' Both statements are taken from the official FY2024-25 Annual Report on heart.org. The report's sentence reads 'As the vision statement for our next 100 years makes clear, we are advancing health and hope for everyone, everywhere.'; the vision is recorded from that sentence with its first word capitalised. The 2028 Impact Goal is a goal and is not recorded.","https://www.heart.org/","Verified","On the site: heart.org names American Heart Association; FY 2024-25 Annual Report hosted on heart.org. Cross-check: heart.org names the AHA and hosts the FY2024-25 Annual Report; charity registers list EIN 13-5613797.","https://www.heart.org/","No change","6 Nov 2026",null,"American Heart Association: Home (https://www.heart.org/); UBC CanSAVE: Improving quality of life for survivors, families and lay responders (https://cansave.ubc.ca/improving-quality-life-survivors-families-and-lay-responders); RQI Partners: AAP and RQI Partners collaborate (2020) (https://rqipartners.com/news-posts/american-academy-of-pediatrics-and-rqi-partners-collaborate-to-deliver-first-ever-neonatal-resuscitation-quality-improvement-solution); Scoring check, 6 Nov 2026: https://www.heart.org/; https://newsroom.heart.org/news/emergency-cardiovascular-care-impact-goal-outlines-3-target-needs","I5: Hospital quality programs (Get With The Guidelines) and RQI resuscitation quality programs. E5: 22 million people trained in CPR each year. S5: More than $6 billion invested in research; ECC guidelines. A5: You're the Cure advocate network and public policy work. Sv4: 'Sudden Cardiac Arrest Survivorship: A Scientific Statement From the American Heart Association' (Circulation, 2020) and the Support Network for patients, survivors and caregivers.","High","Mission quote taken from the heart.org page title; the labelled About page was not opened in this pass.","No","Would AHA share Get With The Guidelines-Resuscitation data definitions with GRA regional alliances outside the US?"],[5,"GRA-05","Citizen CPR Foundation","CCPRF","Foundation",5,"Partner","Unable to verify current HQ (older releases: Falls Church, Virginia; 2017 release datelined Overland Park, Kansas)","United States, with international summit attendance","1987","Unable to verify","Founding partners named as the American Heart Association, American Red Cross and Heart and Stroke Foundation of Canada (JEMS 2012 release). No IRS record checked.","The Citizen CPR Foundation was set up in 1987 to strengthen the Chain of Survival by getting citizens and communities to act. Its main vehicle is the Cardiac Arrest Survival Summit, formerly the Emergency Cardiovascular Care Update (ECCU), which brings survivors, rescuers, EMS and scientists together. It also runs the HEARTSafe community framework.","Community cardiac arrest response, CPR and AED programs","Lay rescuers, CPR instructors, EMS, survivors and community leaders","Convening, education and community action","Direct. Built around the early links of the Chain of Survival.","Education","Advocacy",4,4,2,4,3,17,3,"Education leads through the Summit, with Advocacy close behind in its call for citizen action.","Implementation: Major. Education: Major. Science: Minor. Advocacy: Major. Survivorship: Moderate.","HEARTSafe and the Summit are natural US channels for GRA community programs such as telephone CPR and AED networks.","Not on the ACAN list.","Founded with AHA (#4); SCA Foundation (#14) and Heartsight (#13) share its survivor audience.","No direct ACAN member.","Cardiac Arrest Survival Summit (formerly ECCU, produced since 1985); HEARTSafe Community program (13 strategic and tactical elements); PulsePoint Respond grant competition (2017); CPR Saves Lives March (2015).","We believe that every individual has the potential to make a difference in time-sensitive emergencies. We are committed to empowering citizens, professionals and organizations through comprehensive education, training and advocacy. Together, we will create stronger community support systems that will improve sudden cardiac arrest outcomes.","We know that CPR and AED use saves lives. Collaboration among citizens, professionals, communities and organizations is key to survival from sudden cardiac arrest. Action based on best practices in science, education and implementation improves outcomes.","https://citizencpr.org/our-mission/","https://citizencpr.org/our-mission/","Published","Published","Mission heading on source: 'Our Mission'. Vision heading on source: 'VISION'. Homepage also carries a shorter unlabelled line: 'At the Citizen CPR Foundation, our mission is to save lives from sudden cardiac arrest by fostering a culture...' (cut off by the reader). The /our-mission/ page wording is recorded. Legal name in footer: CPR Foundation, Inc.","https://citizencpr.org/","Verified","On the site: Homepage names Citizen CPR Foundation; footer © 2024 CPR Foundation, Inc. Cross-check: Site names Citizen CPR Foundation; GuideStar profile for Citizen CPR Foundation Inc (EIN 51-0312256, Overland Park, KS) lists WWW.CITIZENCPR.ORG. Footer reads 'CPR Foundation, Inc.', which differs from the registered name. CCPRF also uses an event page at na.eventscloud.com/ehome/108317.","https://citizencpr.org/","No change","6 Nov 2026",null,"JEMS: ECCU 2012 announcement (https://www.jems.com/ems-operations/eccu-2012-emergency-cardiovascular-care/); EMS World: HEARTSafe, empowering communities for cardiac arrest survival (https://www.hmpgloballearningnetwork.com/site/emsworld/feature-story/heartsafe-empowering-communities-cardiac-arrest-survival); PulsePoint: CCPRF and PulsePoint grant competition (2017) (https://www.pulsepoint.org/news/citizen-cpr-foundation-and-pulsepoint-competition-to-award-20-000-grant-for-local-pulsepoint-respond-implementation); Scoring check, 6 Nov 2026: https://citizencpr.org/","I4: HEARTSafe Community with 600+ communities committed to AED access, CPR training and response protocols; Lifesaving Strategies (CPR in Schools, Dispatch CPR, In-Hospital Strategies). E4: Cardiac Arrest Survival Summit every two years since 1985; Learn CPR and AED and Resuscitation Leadership programs. S2: Shares science at the Summit; no research of its own. A4: Mission is citizen and community action and advocacy; HEARTSafe drives local commitments. Sv3: Survivors are a named Summit audience; no recovery program of its own.","High","Mission wording has changed: the 2012 release says 'to save lives from sudden death by stimulating citizen and community action'; later sources say 'sudden cardiac arrest' and add 'professional'. HQ location differs between releases. Official site not opened.","Yes","Is citizencpr.org the current live site, and whe endent listing in the UIA Yearbook (checked Sept 2026); search on 6 Nov 2026 returned no other page linking to the site. Site uses a website-builder path (/home-1).","https://www.asiansem.org/home-1","No change","6 Nov 2026",null,"UIA Open Yearbook: Asian Society for Emergency Medicine (https://uia.org/s/or/en/1100059191); IFEM: Society for Emergency Medicine in Singapore (https://www.ifem.cc/99); Scoring check, 6 Nov 2026: https://www.asiansem.org/home-1","I2: No program named on the site. E3: Asian Conference for Emergency Medicine series ('Our Footprints' page lists the 3rd ACEM) and an Education Resources section. S2: No research or journal found. A3: Objectives to promote emergency medicine in Asia and represent members to international bodies; Position Statements section. Sv1: Nothing found.","Moderate","Website listed by UIA but not opened. Program details thin.","Yes","Is ASEM still active, and who is the current president?"],[20,"GRA-20","Essential Emergency and Critical Care Global","EECC Global; EECC Network (from 2021); Essential Emergency and Critical Care","Network",20,"Partner","Stockholm, Sweden (leadership at Karolinska Institutet; not confirmed as registered office)","Global, focus on low- and middle-income countries","Concept 2018; EECC Network 2021; EECC Global organisation set up by 2025","Unable to verify","Founder post on HIFA (September 2025) says 'the organisation EECC Global has been set up'. No registry detail found.","EECC is a package of 40 low-cost clinical processes and 67 hospital readiness requirements that every critically ill patient should get, wherever they are in a hospital. It came out of a 2021 consensus of 269 experts led by Karolinska Institutet, Ifakara Health Institute and LSHTM. EECC Global was set up to make this a global standard; modelling suggests it could save up to a million lives a year.","Critical illness care on general wards and emergency units, mostly in low-resource hospitals","Critically ill patients of all ages; hospital staff and policymakers","Research-led advocacy and implementation network","Significant adjacent. Covers recognising and treating critical illness, which prevents in-hospital cardiac arrest.","Science","Implementation",4,3,5,3,2,17,2,"Science leads through the EECC consensus, with Implementation second through hospital readiness work in Tanzania.","Implementation: Major. Education: Moderate. Science: Core. Advocacy: Moderate. Survivorship: Minor.","Covers the step before in-hospital cardiac arrest: spotting and treating critical illness on the ward. A strong fit for GRA in-hospital work.","On ACAN at #19 as 'EECC Global'.","AFEM (#17) founder Lee Wallis is an EECC consensus author; SCCM (#8) works the same critical care space.","Same entity as ACAN #19. WFSA (#98) hosts the EECC consensus in its resource library; natural link to the World Federation of Intensive and Critical Care (#95).","EECC consensus (BMJ Global Health 2021): 40 clinical processes, 67 readiness requirements; 2018 Critical Care viewpoint defining EECC; EECC training, tools and implementation in Tanzania; EECC Network of about 300 experts in 50+ countries.","To avert the deaths of 1 million critically ill patients per year by ensuring the provision of Essential Emergency and Critical Care throughout the world.","A world where nobody dies of a condition that Essential Emergency and Critical Care could prevent.","https://www.eeccglobal.org/vision-mission","https://www.eeccglobal.org/vision-mission","Published","Published","Mission heading on source: 'Mission'. Vision heading on source: 'Vision'. No legal or registration detail on the homepage.","https://eeccglobal.org/","Verified","On the site: eeccglobal.org: 'Copyright © 2026 EECC Global'; Board, 2025 Annual Summary and Vision & Mission pages. Cross-check: eeccglobal.org: 'Copyright © 2026 EECC Global', board and 2025 annual summary pages; HIFA posts by EECC founders (2025) name the organisation EECC Global.","https://eeccglobal.org/" iety, representing 38 national societies and more than 40,000 professionals. Its annual congress draws over 3,600 people, and it has sections for prehospital, paediatric, disaster and other areas. It is also a named sister association of the ERC.","Emergency medicine practice, training and research in Europe","Emergency physicians, nurses and paramedics in Europe","Professional society: education, research, standards","Significant adjacent. ED resuscitation and prehospital care; runs a World Restart a Heart competition.","Education","Science",2,5,4,4,1,16,3,"Education leads through the congress and academy, with Science second through its research network and sections.","Implementation: Minor. Education: Core. Science: Major. Advocacy: Major. Survivorship: None evident.","The emergency department link in European resuscitation. Its World Restart a Heart competition and ERC sister status make it an easy GRA ally.","On ACAN at #23.","ERC (#10) sister association; backed ILCOR's (#3) 2023 statement; the EUSEM Disaster Medicine Section works the same field as ECDM (ACAN #22).","Same entity as ACAN #23. IFEM (#47) member; ESTES (#24) works the neighbouring trauma field.","European Emergency Medicine Congress (3,600+ attendees); EUSEM Academy; sections (Disaster, Geriatric, Paediatric/REPEM, Pre-hospital, Toxicology, Ultrasound, Young EM Doctors); Research Network; World Restart a Heart day competition; European Journal of Emergency Medicine.","To advance research, education, practice and standards of the specialty of emergency medicine throughout Europe.","whose vision is to ensure every patient recieves the best Emergency Care in Europe.","https://eusem.org/about-us","https://eusem.org/about-us","Published","Published","Mission heading on source: 'Our mission:'. Vision heading on source: 'Introduced by 'whose vision is' in the About Us opening paragraph'. Vision is part of a sentence, recorded from 'whose vision is' onward, with the site's spelling 'recieves'. About Us n in official relations with WHO since 1957. It strengthens associations and sets the global definition and scope of midwifery practice.","Midwifery; sexual, reproductive, maternal and newborn health","Midwives, midwives' associations, childbearing women and newborns","Global professional federation and standard setter","Significant adjacent. Midwives are often the first responder for newborn resuscitation and obstetric emergencies.","Advocacy","Implementation",4,4,2,5,1,16,3,"Advocacy leads as the global voice of midwives, with Implementation second through association capacity building.","Implementation: Major. Education: Major. Science: Minor. Advocacy: Core. Survivorship: None evident.","Midwives deliver newborn resuscitation at many births in low-resource settings, which puts ICM at the centre of the GRA newborn alliance.","On ACAN at #45.","EWENE (#7) country work runs through national midwives' associations; AAP (#18) Helping Babies Breathe trains midwives.","Same entity as ACAN #45. International Council of Nurses (#46) is the sister professional body.","ICM Definition and Scope of Practice of a Midwife; capacity building for midwives' associations; technical consultations; governance policies (December 2025).","We champion and advance midwives' associations and the profession of midwifery globally by setting and implementing the Global Standards for Midwifery. We advocate for midwives as the most appropriate primary health professionals for sexual, reproductive, maternal, adolescent, and newborn care.","We envision a world where every woman, newborn and adolescent has access to a competent and autonomous midwife, and every midwife is enabled to provide equitable, inclusive, and rights-based care.","https://internationalmidwives.org/who-we-are/","https://internationalmidwives.org/who-we-are/","Published","Published","Mission heading on source: 'Our Mission'. Vision heading on source: 'Our Vision'. Both statements have changed since the September 2026 workboo
